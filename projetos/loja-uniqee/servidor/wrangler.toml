# Loja Uniqee na Cloudflare: o Worker responde /api/* e serve a loja e o painel (pasta ../loja).
name = "uniqee-loja"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../loja"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "uniqee-loja"
# o id real entra quando o banco for criado na conta da Cloudflare do Edyfran
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "uniqee-loja-arquivos"

# Segredos (wrangler secret put; aqui na VPS ficam em .dev.vars, fora do git):
# ADMIN_SENHA   senha de entrada no painel
# SEGREDO       chave que assina a sessão do painel
