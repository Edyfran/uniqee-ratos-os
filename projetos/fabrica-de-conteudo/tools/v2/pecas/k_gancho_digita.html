<!DOCTYPE html>
<!-- TIPOGRAFIA — gancho digitado (clone do "Kinetic hook"): duas linhas em sans Black, CAIXA ALTA, que se digitam com
     um cursor de bloco; a segunda entra de golpe, com cunhas diagonais da cor do fundo cobrindo pedaços das letras. Parado
     um instante, o bloco inteiro sobe uns 85 px em ~0,12 s, linear, e some (corte). Sem sombra e sem quique: a entrada é
     em degraus. O texto mora ATRÁS da pessoa (data-c="tras"): o plano liga `desenho.atras` e põe `atras: true` no item.
     1080x1920, --alpha. As duas linhas se ajustam à largura `larg`, então a segunda (mais longa) sai menor.
       l1 · l2   as duas linhas (GANCHO · CINÉTICO)
       x · y     o canto esquerdo da tinta e o topo da maiúscula da linha 1, em px (50 · 350) · larg  a largura das linhas (600: termina em x 650, longe do painel em 708)
       t0 · sai  quando entra (0) e quando começa a subir (-1: dur - 0,25) · dur
       cunha     a cor das cunhas (o azul em bloco do núcleo: a tinta sumia no fundo escuro)
       ?l1=GANCHO&l2=CINÉTICO&x=50&y=350&larg=620&t0=0&dur=1.1 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/editorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px;background:transparent}
#stage{padding:0;display:block;background:none}
#blk{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ln{position:absolute;white-space:nowrap;line-height:1;font-family:var(--ed-sans);font-weight:900;
  text-transform:uppercase;letter-spacing:-.035em;color:var(--ed-pp)}
.ln i{display:inline-block;font-style:normal;opacity:0}
.cu{position:absolute;background:var(--ed-pp);opacity:0}
.cn{position:absolute;background:var(--ac)}
</style>
</head>
<body>
<div id="stage"><div id="blk" data-c="tras"></div></div>
<script>
const $ = id => document.getElementById(id);
const dur = D.n('dur', '1.1'), t0 = D.n('t0', '0'), sai0 = D.n('sai', '-1');
const sai = sai0 < 0 ? dur - .25 : sai0;
const X = D.n('x', '30'), Y = D.n('y', '350'), larg = D.n('larg', '650'), larg1 = D.n('larg1', '490');
const textos = [D.q('l1', 'GANCHO'), D.q('l2', 'CINÉTICO')];
const blk = $('blk');
const linhas = textos.map(tx => {
  const d = document.createElement('div'); d.className = 'ln';
  d.innerHTML = [...tx].map(c => `<i>${c === ' ' ? '&nbsp;' : c}</i>`).join('');
  blk.appendChild(d); return d;
});
const cunha = D.q('cunha', '');
const cursor = document.createElement('div'); cursor.className = 'cu'; blk.appendChild(cursor);

document.fonts.load('900 100px Inter').catch(() => null).then(() => D.monta(tl => {
  const cx = document.createElement('canvas').getContext('2d');
  const geo = [];
  let yy = Y;
  linhas.forEach((d, k) => {
    // o corpo que enche `larg`: mede a linha a 100 px e escala
    d.style.fontSize = '100px'; d.style.left = '0px';
    const w100 = d.getBoundingClientRect().width - 3.5;           // tira o aperto da última letra
    const fs = 100 * (k === 0 ? larg1 : larg) / w100;
    d.style.fontSize = fs + 'px';
    cx.font = `900 ${fs}px Inter`;
    const m = cx.measureText(textos[k].normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase());
    const cap = m.actualBoundingBoxAscent;
    const topoTinta = fs / 2 + (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 - cap;
    d.style.left = X + 'px'; d.style.top = (yy - topoTinta) + 'px';
    geo.push({d, fs, cap, topo: yy, letras: [...d.children]});
    yy += cap + (k === 0 ? Math.round(cap * .36) : 0);
  });
  const T = D.at(t0), P1 = .032;
  // linha 1: uma letra por passo, o cursor de bloco vai na frente
  const g1 = geo[0], g2 = geo[1];
  const cw = g1.cap * .62, ch = g1.cap * .2;
  Object.assign(cursor.style, {width: cw + 'px', height: ch + 'px'});
  g1.letras.forEach((l, i) => {
    const t = T + i * P1;
    tl.set(l, {opacity: 1}, t);
    const prox = g1.letras[i + 1];
    const xr = prox ? prox.offsetLeft : l.offsetLeft + l.offsetWidth;
    tl.set(cursor, {opacity: 1, left: X + xr + 4, top: g1.topo + g1.cap - ch}, t);
  });
  const tFim1 = T + (g1.letras.length - 1) * P1 + P1;
  tl.set(cursor, {opacity: 0}, tFim1);
  D.cue(T, 'type', {dur: +(g1.letras.length * P1).toFixed(3)});
  // linha 2: de 3 em 3 letras, ainda mais seca, e as cunhas já no lugar
  const t2 = tFim1 - .07;
  g2.letras.forEach((l, i) => tl.set(l, {opacity: 1}, t2 + Math.floor(i / 3) * P1));
  const mais = [[0, 'bl'], [Math.min(6, g2.letras.length - 1), 'bl']];
  const cortes = [[g1.letras.length - 1, g1, 'dir'], ...mais.map(([i, t]) => [i, g2, t])];
  cortes.forEach(([i, g, tipo]) => {
    const l = g.letras[i], c = document.createElement('div'); c.className = 'cn';
    if (cunha) c.style.background = cunha;
    const w = l.offsetWidth, h = g.cap;
    Object.assign(c.style, {left: X + l.offsetLeft - 6 + 'px', top: g.topo - 6 + 'px', width: w + 12 + 'px', height: h + 12 + 'px',
      clipPath: tipo === 'dir' ? 'polygon(45% -8%,108% -8%,108% 108%,12% 108%)' : 'polygon(-8% 20%,95% 108%,-8% 108%)',
      opacity: 0});
    blk.appendChild(c);
    tl.set(c, {opacity: 1}, i === g1.letras.length - 1 && tipo === 'dir' && g === g1 ? tFim1 : t2);
  });
  D.cue(t2, 'thud');
  // a saída: o bloco sobe ~85 px em linha reta e some
  tl.to(blk, {y: -85, duration: .12, ease: 'none'}, sai);
  tl.set(blk, {opacity: 0}, sai + .12);
  return dur;
}));
</script>
</body>
</html>
