<!DOCTYPE html>
<!-- SOCIAL — comenta QUERO: a palavra gigante cai letra a letra dentro do campo "Adicione um comentário…", o botão
     Publicar acende e o campo vira o comentário publicado. Clone do efeito 18 da referência Dej8homsIzp. Sai por corte
     no fim da janela. 1080x1920, --alpha. Coluna esquerda alta (x 45-685), longe do painel lateral. O rodapé do
     painel ficando dourado é do e_painel_lista, não daqui.
       palavra  as letras que caem (QUERO) · ph  o texto do campo (Adicione um comentário…) · bt  o botão (Publicar)
       eu  o rótulo do comentário (você) · foto  o avatar · x  y  o canto do campo (45, 485) · t0 (0.05) · dur (1.3)
       ?palavra=QUERO&ph=Adicione um comentário…&bt=Publicar&eu=você&t0=0.05&dur=1.3 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;src:url(../nucleo/fontes/Inter-opsz-wght.ttf) format('truetype')}
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
#gg{position:absolute;left:0;top:0;display:flex;opacity:0}
#gg span{display:block;font:900 190px/1 'Inter',var(--fd);letter-spacing:-.04em;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;
  text-shadow:8px 8px 0 var(--ink);transform-origin:50% 50%}
#cp{position:absolute;width:640px;height:107px;border-radius:54px;opacity:0}
#cp .av{position:absolute;left:21px;top:21px;width:65px;height:65px;border-radius:50%;object-fit:cover;background:var(--ink);border:3px solid var(--ink)}
#ph{position:absolute;left:108px;top:0;height:107px;display:flex;align-items:center;font:500 28px/1 var(--fd);color:var(--ink4);white-space:nowrap}
#lb{position:absolute;left:108px;top:14px;font:600 16px/1 var(--fm);letter-spacing:.04em;color:var(--ink4);opacity:0;white-space:nowrap}
#lin{position:absolute;left:108px;top:0;height:107px;display:flex;align-items:center;white-space:nowrap}
#tx{font:700 38px/1 var(--fd);letter-spacing:-.01em;color:var(--ink)}
#tx span{display:none}
#car{flex:none;width:4px;height:42px;margin-left:3px;background:var(--ac);opacity:0}
#bt{position:absolute;right:16px;top:21px;width:134px;height:65px;border-radius:33px;display:flex;align-items:center;justify-content:center;
  font:700 28px/1 var(--fd);letter-spacing:-.01em;background:var(--ink2);color:var(--ink4);border:var(--bw) solid var(--ink2)}
</style>
</head>
<body>
<div id="stage">
  <div class="nb" id="cp"><img class="av" id="a1"><div id="ph"></div><div id="lb"></div>
    <div id="lin"><span id="tx"></span><i id="car"></i></div><div id="bt"></div></div>
  <div id="gg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const dur = D.n('dur', '1.3'), t0 = D.n('t0', '0');
const palavra = D.q('palavra', 'QUERO');
$('a1').src = D.q('foto', '../midia/perfil-avatar.png');
$('ph').textContent = D.q('ph', 'Adicione um comentário…'); $('bt').textContent = D.q('bt', 'Publicar');
$('lb').textContent = D.q('eu', 'você') + ' · agora';
$('gg').innerHTML = [...palavra].map(c => '<span>' + c + '</span>').join('');
$('tx').innerHTML = [...palavra].map(c => '<span>' + c + '</span>').join('');
const X = D.n('x', '45'), Y = D.n('y', '485');
Object.assign($('cp').style, {left: X + 'px', top: Y + 'px'});

D.monta(tl => {
  const gg = $('gg'), ls = [...gg.children], ts = [...$('tx').children];
  // as letras ocupam uma faixa de ~600 px com a altura de maiúscula da referência (140 px) acima do campo
  const w0 = gg.offsetWidth, k = Math.min(1, 600 / w0);
  ls.forEach(l => { l.style.fontSize = 190 * k + 'px'; });
  gsap.set(gg, {left: X + 40, top: 272 - 190 * k * .14});
  const R = ls.map(l => l.getBoundingClientRect()), C = $('tx').getBoundingClientRect();
  // o campo no começo é curto (480) e estica até 640 quando as letras chegam
  const tEsq = t0 + .12, tCai = Math.max(t0 + .5, dur - .95), tPub = dur - .32, tSai = dur - .15;
  gsap.set('#cp', {width: 570});
  tl.fromTo('#cp', {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: .1, ease: 'power3.out'}, t0);
  tl.to('#cp', {width: 640, duration: .18, ease: 'power3.out'}, tEsq + .1);
  D.cue(t0, 'pop');
  // as letras entram em cascata curta (a E pequena no ar primeiro), ficam paradas e depois caem
  tl.set('#gg', {opacity: 1}, 0);
  ls.forEach((l, i) => {
    const te = t0 + i * .035;
    tl.fromTo(l, {opacity: 0, scale: .4, y: -30}, {opacity: 1, scale: 1, y: 0, duration: .16, ease: 'power3.out'}, te);
  });
  D.cue(t0 + .02, 'hit');
  // cada letra cai com gravidade até a posição da própria letra dentro do campo e encolhe; chegando, a letra aparece escrita
  const larg = ts.map(s => 0), px = 24;
  ls.forEach((l, i) => {
    const ta = tCai + i * .07, dd = .27;
    const cx = C.left + i * px + px / 2, cy = Y + 107 / 2;
    tl.to(l, {x: cx - (R[i].left + R[i].width / 2), y: cy - (R[i].top + R[i].height / 2), scale: 38 / (190 * k), duration: dd, ease: 'power2.in'}, ta);
    tl.set(l, {opacity: 0}, ta + dd);
    tl.set(ts[i], {display: 'inline-block'}, ta + dd);
  });
  const tPri = tCai + .27;
  tl.set('#ph', {opacity: 0}, tPri);
  tl.set('#car', {opacity: 1}, tPri);
  tl.set('#bt', {backgroundColor: D.css('--ac'), borderColor: D.css('--ink'), color: '#fff'}, tPri);
  D.cue(tPri, 'thud');
  // publicado: o campo vira o comentário
  tl.set('#car', {opacity: 0}, tPub);
  tl.set('#lb', {opacity: 1}, tPub);
  tl.set('#lin', {y: 12}, tPub);
  D.cue(tPub, 'click');
  tl.set(['#cp', '#gg'], {opacity: 0}, tSai);
  return dur;
});
</script>
</body>
</html>
