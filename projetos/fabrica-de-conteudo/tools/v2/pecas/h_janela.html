<!DOCTYPE html>
<!-- AULA — a captura dentro de uma janela de navegador, no papel. 1920x1080, tela cheia.
     Pra gravação de app (vídeo) e pra print (imagem): a janela tem a barra com o endereço,
     a câmera aproxima por trechos e o grifo amarelo com etiqueta marca o que a fala aponta.
     Coordenadas em fração da CAPTURA (x,y,largura,altura), como no h_zoom.
       ?img=captura.png|reply.seudominio.com.br/settings@0;outra.png|developers.facebook.com/apps@4
        &cam=1.2,0.3,0.4,0.4,0.3;5,0,0,1,1&mk=1.6,4.2,0.31,0.55,0.4,0.05,cole o ID aqui&entra=1&off=0&alto=945&dur=8
     img: lista "arquivo|endereço@t" (troca seca no t). cam: "t,x,y,w,h" (w=1 volta inteira).
     mk: "t0,t1,x,y,w,h,etiqueta". off: segundo do vídeo no t=0. entra=0 começa parada (continuação).
     Sem img, usa a tela de exemplo. -->
<html lang="pt-BR" class="h">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/h-exemplo.js"></script>
<style>
#jan{position:absolute;left:120px;top:42px;width:1680px;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--cod);
  box-shadow:var(--shx,var(--sh)) var(--shx,var(--sh)) 0 var(--ink);overflow:hidden}
#barra{height:50px;display:flex;align-items:center;gap:22px;padding:0 20px;background:var(--pp);border-bottom:var(--bw) solid var(--ink)}
.bola{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--pp2)}
#bolas{display:flex;gap:9px}
#end{flex:1;max-width:980px;height:32px;display:flex;align-items:center;gap:10px;padding:0 16px;border:3px solid var(--ink);border-radius:99px;
  font:600 19px/1 var(--fm);color:var(--ink);background:var(--pp2);white-space:nowrap;overflow:hidden}
#end .cad{width:11px;height:13px;border:3px solid var(--ink);border-radius:3px;position:relative;top:2px}
#end .cad::before{content:'';position:absolute;left:0;top:-9px;width:5px;height:7px;border:3px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0}
#end b{font-weight:700}#end i{font-style:normal;color:var(--ink4)}
#vis{position:relative;width:1680px;height:var(--alto,945px);overflow:hidden;background:var(--cod)}
#tela{position:absolute;left:0;top:0;width:1920px;height:var(--telah,1080px);transform-origin:0 0}
.cap{position:absolute;inset:0;opacity:0}.cap.ja{opacity:1}
.cap .mid{width:100%;height:100%}
.alvo{position:absolute;border:6px solid var(--mk);border-radius:12px;box-shadow:0 0 0 3px var(--ink),0 0 0 4000px rgba(11,13,18,var(--veu,0));opacity:0}
.rot{position:absolute;padding:12px 18px 10px;font:700 30px/1 var(--fm);letter-spacing:.04em;text-transform:uppercase;border-radius:var(--raio-s);white-space:nowrap;opacity:0;
  background:var(--mk);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
</style>
</head>
<body>
<div id="stage"><div id="jan"><div id="barra"><div id="bolas"><i class="bola"></i><i class="bola"></i><i class="bola"></i></div>
  <div id="end"><span class="cad"></span><span id="url"></span></div></div>
  <div id="vis"><div id="tela" data-qa="fundo"></div></div></div></div>
<script>
const dur = D.n('dur', '8'), $ = id => document.getElementById(id);
const BASE = 1680 / 1920, ALTO = D.n('alto', 945);   // alto: janela mais alta (o storyboard filmado em coluna)
document.documentElement.style.setProperty('--alto', ALTO + 'px');
document.documentElement.style.setProperty('--telah', ALTO / BASE + 'px');
const caps = D.q('img', '').split(';').filter(Boolean).map(s => {
  const [resto, t] = s.split('@'); const [arq, url] = resto.split('|');
  return {arq, url: url || '', t: parseFloat(t || '0')};
});
if (!caps.length) { const d = document.createElement('div'); d.className = 'cap ja'; $('tela').appendChild(d); telaExemplo(d); }
caps.forEach((c, i) => {
  const d = document.createElement('div'); d.className = 'cap' + (i === 0 ? ' ja' : ''); d.id = 'cap' + i; $('tela').appendChild(d);
  // o mesmo vídeo em várias entradas é um take só: o relógio dele não para na troca de endereço
  const ant = caps.slice(0, i).find(o => o.arq === c.arq);
  if (ant) { d.dataset.mesmo = caps.indexOf(ant); return; }
  const m = D.midia('#cap' + i, c.arq, 'captura', 'cover');
  if (m && m.tagName === 'VIDEO') m.dataset.off = String(D.n('off', '0'));
});
const urlDe = u => { const [host, ...resto] = u.split('/'); return `<b>${host}</b><i>${resto.length ? '/' + resto.join('/') : ''}</i>`; };
$('url').innerHTML = urlDe(caps[0]?.url || 'reply.seudominio.com.br');

// câmera: cada parada enquadra uma área da captura (fração), w>=1 volta inteira
const quadro = (x, y, w, h) => {
  if (w >= 1) return {x: 0, y: 0, scale: BASE};
  const z = Math.max(1, Math.min(1 / w * .62, 1 / h * .62, 2.6)), s = BASE * z;
  let tx = 840 - s * 1920 * (x + w / 2), ty = 472.5 - s * 1080 * (y + h / 2);
  tx = Math.min(0, Math.max(1680 - 1920 * s, tx)); ty = Math.min(0, Math.max(ALTO - 1080 * s, ty));
  return {x: tx, y: ty, scale: s};
};
gsap.set('#tela', {x: 0, y: 0, scale: BASE});
const cams = D.q('cam', '').split(';').filter(Boolean).map(s => s.split(',').map(Number));
const mks = D.q('mk', '').split(';').filter(Boolean).map(s => { const p = s.split(','); return {t0: +p[0], t1: +p[1], x: +p[2], y: +p[3], w: +p[4], h: +p[5], rot: p.slice(6).join(',')}; });
mks.forEach((m, i) => {
  const a = document.createElement('div'); a.className = 'alvo'; a.id = 'al' + i;
  Object.assign(a.style, {left: m.x * 1920 - 12 + 'px', top: m.y * 1080 - 12 + 'px', width: m.w * 1920 + 24 + 'px', height: m.h * 1080 + 24 + 'px'});
  $('tela').appendChild(a);
  if (m.rot) { const r = document.createElement('div'); r.className = 'rot nb'; r.id = 'rt' + i; r.textContent = m.rot; $('tela').appendChild(r); }
});

D.monta(tl => {
  if (D.q('entra', '1') !== '0') D.pousa('#jan', .05, {som: 'whoosh'});
  // a quadro de quem mostra cada entrada: a dela, ou a do mesmo vídeo que veio antes
  const quem = i => { const m = $('cap' + i).dataset.mesmo; return m === undefined ? i : +m; };
  caps.forEach((c, i) => {
    if (i === 0) return;
    const ag = quem(i), an = quem(i - 1);
    if (ag !== an) { tl.set('#cap' + ag, {opacity: 1}, c.t); tl.set('#cap' + an, {opacity: 0}, c.t); D.cue(c.t, 'tick'); }
    tl.call(() => { $('url').innerHTML = urlDe(c.url); }, null, c.t);
    tl.call(() => { $('url').innerHTML = urlDe(caps[i - 1].url); }, null, c.t - .001);
  });
  cams.forEach(([t, x, y, w, h]) => {
    tl.to('#tela', {...quadro(x, y, w, h), duration: .8, ease: 'power3.inOut'}, D.at(t));
    D.cue(t, w >= 1 ? 'whoosh-out' : 'zoom-in');
  });
  mks.forEach((m, i) => {
    const rt = $('rt' + i), a = $('al' + i);
    if (rt) {
      const baixo = m.y + m.h < .8;
      rt.style.left = Math.max(20, Math.min(1900 - rt.offsetWidth, m.x * 1920 - 12)) + 'px';
      rt.style.top = (baixo ? (m.y + m.h) * 1080 + 26 : m.y * 1080 - 26 - rt.offsetHeight) + 'px';
    }
    tl.fromTo(a, {opacity: 0, scale: 1.2, '--veu': 0}, {opacity: 1, scale: 1, '--veu': .32, duration: .45, ease: D.P.MOLA}, D.at(m.t0));
    D.cue(m.t0, 'pop');
    if (rt) D.carimbo(rt, m.t0 + .2, 0);
    tl.to([a, rt].filter(Boolean), {opacity: 0, duration: .2, ease: 'power2.in'}, m.t1);
    tl.to(a, {'--veu': 0, duration: .2}, m.t1);
  });
  return dur;
});
</script>
</body>
</html>
