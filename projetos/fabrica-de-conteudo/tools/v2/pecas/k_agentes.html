<!DOCTYPE html>
<!-- TIPOGRAFIA + INTERFACE — o fecho do anúncio "Edita o meu assim" (B5 e B6): "Isso é a Fábrica de Conteúdo, dentro do seu Claude Code
     ou Codex. Toca em Saiba mais e vê funcionando." A marca pousa e o nome sobe por palavra no instante da voz; os dois encaixes
     (Claude Code e Codex) chegam de lado, em arco, e cada um acende o LED ao encaixar (CONECTADO 0/2 → 2/2), como o chip que conecta
     do original; por último o botão azul "Toca em Saiba mais" assenta e é apertado, a seta aponta pra baixo, e o celular sobe do pé
     tocando o vídeo editado de verdade ("vê funcionando"). Sem preço, sem aviso de IA na tela (ele vai no texto do anúncio).
     A marca entra em tamanho de herói, no meio do quadro (o papel nunca fica vazio), e na hora do "dentro do seu" encolhe pro lugar
     dela, no alto, abrindo o espaço dos dois encaixes, que já esperam como vagas tracejadas.
     1080x1920 e 1080x1350 (`?ar=1080x1350`: o desenho do 4:5 é outro). Texto que se lê dentro da área segura (x 65–1015,
     y 270–1250; no 4:5, o quadro com 54 de margem); o celular, que não é texto, sobe e passa do pé.
     Movimento do núcleo (os 12 princípios): o cartão pousa (D.pousa, de lado em arco), o nome sobe por palavra (D.palavras),
     o botão assenta e é apertado, a câmera e o botão respiram até o fim (D.camera, D.respira). Não sai: é o último quadro.
       img  a marca (../midia/marca-fabrica.svg) · nome  as 2 linhas, por | · t  os instantes (JSON, em s da peça: isso, fabrica, dentro, a1, a2,
       toca, aperta) · cel  o celular (../midia/objeto-celular.png) · celv  o vídeo na tela dele · celv0  o segundo em que ele começa
       a1, a2  os dois encaixes · hero=1  o celular grande no meio e as vagas tracejadas · dur  a duração
       plano  1 troca o botão por texto simples (sem borda, sem aperto, sem seta), pro Reel orgânico, onde não há botão pra apontar:
       a chamada fica em ink, com o trecho entre * no marcador e | quebrando a linha; cta vazio tira a chamada
       ?img=../midia/marca-fabrica.svg&nome=Fábrica de|Conteúdo&a1=Claude Code&a2=Codex&dur=7.1 -->
<html lang="pt-BR" data-qa="fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/papel.js"></script>
<script>const AR45 = (new URLSearchParams(location.search).get('ar') || '').indexOf('1080x1350') === 0;
if (AR45) document.write('<style>html,body,#stage,#mundo{height:1350px!important}#kick,#pl,#nome{z-index:3}</style>');</script>
<style>
html,body,#stage{width:1080px;height:1920px}
#stage{padding:0;display:block;overflow:hidden;background:var(--pp)}
#mundo{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 45%}
#papel{position:absolute;left:0;top:0}
.ab{position:absolute;opacity:0}
#kick{position:absolute;left:72px;margin:0;transform-origin:0 0}
#pl{position:absolute;left:72px;transform-origin:0 0;display:grid;place-items:center;padding:0}
#pl img{width:78%;height:78%}
#nome{position:absolute;font:800 128px/.98 var(--fd);letter-spacing:-.045em;color:var(--ink);white-space:nowrap;transform-origin:0 0}
#nome i{font-style:normal;color:var(--ac)}
#dentro{position:absolute;left:72px;font:700 66px/1 var(--fd);letter-spacing:var(--ls);color:var(--ink);white-space:nowrap}
#cnt{position:absolute;right:72px;height:64px;padding:0 20px;display:flex;align-items:center;gap:14px;font:700 24px/1 var(--fm);letter-spacing:.1em;color:var(--ink6);white-space:nowrap;opacity:0}
#cnt .n{position:relative;width:78px;height:50px}
#cnt .n b{position:absolute;left:0;right:0;top:0;font:700 46px/50px var(--fd);letter-spacing:-.03em;color:var(--ink);text-align:center;opacity:0}
.ag{position:absolute;left:72px;width:936px;box-sizing:border-box;display:flex;align-items:center;gap:26px;padding:0 28px;opacity:0}
.ag .ic2{flex:none;width:84px;height:84px;border-radius:20px;display:grid;place-items:center;background:var(--ink)}
.ag .ic2 svg{width:56px;height:56px;overflow:visible}
.ag .tx{font:800 74px/1 var(--fd);letter-spacing:-.04em;color:var(--ink);white-space:nowrap}
.ag .tx b{font-weight:inherit;padding:0 .12em;margin:0 -.12em;background:linear-gradient(var(--mk),var(--mk)) no-repeat 0 62%/0% 84%}
.ag .led{flex:none;margin-left:auto;display:flex;align-items:center;gap:12px;font:700 24px/1 var(--fm);letter-spacing:.1em;color:var(--ink4)}
.ag .led i{width:34px;height:34px;border-radius:50%;border:4px solid var(--ink);box-sizing:border-box;background:var(--pp2)}
.ghost{position:absolute;left:72px;width:936px;box-sizing:border-box;border:5px dashed var(--ink4);border-radius:var(--raio);display:flex;align-items:center;gap:26px;padding:0 28px;opacity:0;
  font:800 var(--gfs,86px)/1 var(--fd);letter-spacing:-.04em;color:var(--ink2);white-space:nowrap}
.ghost i{flex:none;width:var(--gic,104px);height:var(--gic,104px);border-radius:24px;border:5px dashed var(--ink4);box-sizing:border-box}
.ghost span{margin-left:auto;font:700 26px/1 var(--fm);letter-spacing:.1em;color:var(--ink4)}
#bt{position:absolute;left:72px;width:880px;height:118px;font-size:62px;white-space:nowrap}
#bt b{display:inline-block;margin-left:.22em;padding:0 .2em;border-radius:10px;background:var(--mk);color:var(--ink)}
#se{position:absolute;width:80px;height:80px}
#se svg{width:100%;height:100%;overflow:visible}
#bt.plano{background:none;border:0;box-shadow:none;color:var(--ink);justify-content:flex-start;font-weight:800;letter-spacing:-.03em;transform-origin:0 50%;padding-left:30px;height:auto!important;line-height:1.05;display:block}
#cel{position:absolute;left:0;top:0;width:748px;height:1554px;transform-origin:0 0;filter:drop-shadow(16px 16px 0 var(--ink));opacity:0}
#cel .corpo{position:absolute;left:0;top:0;width:748px;height:1554px;display:block}
#cel .tela{position:absolute;left:21px;top:17px;width:690px;height:1518px;border-radius:66px;overflow:hidden;background:var(--ink)}
#cel .cam{position:absolute;left:359px;top:56px;width:30px;height:30px;border-radius:50%;background:var(--cine);z-index:4;box-shadow:0 0 0 4px #0b0d12,inset 3px 3px 0 rgba(120,150,255,.28)}
</style>
</head>
<body>
<div id="stage"><div id="mundo">
  <svg id="papel"></svg>
  <span class="kick" id="kick"></span>
  <div class="nb ab" id="pl"></div>
  <div id="nome"></div>
  <div id="dentro"></div>
  <span class="nb" id="cnt"><span>CONECTADO</span><span class="n"><b>0/2</b><b>1/2</b><b>2/2</b></span></span>
  <div class="ghost" id="g1"></div><div class="ghost" id="g2"></div>
  <div class="nb ag" id="a1"></div>
  <div class="nb ag" id="a2"></div>
  <div class="ab btn" id="bt"></div>
  <div class="ab" id="se"><svg viewBox="0 0 140 190"><path d="M45 6h50v104h39L70 184 6 110h39z" fill="var(--mk)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/></svg></div>
</div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const W = 1080, H = AR45 ? 1350 : 1920, Q = D.QD, dur = D.n('dur', '7.1');
const L = AR45 ? {kick: 58, logo: [100, 150], nome: [100, 92], dentro: 322, cnt: 312, ag: [404, 540, 118], agFs: 70, ic: 78, bt: 700, se: 818, cel: [293, 920, .66], kf: .9,
                  celhero: [239, 330, .84]}
              : {kick: 276, logo: [330, 210], nome: [330, 138], dentro: 636, cnt: 624, ag: [770, 940, 150], agFs: 86, ic: 104, bt: 1124, se: 1250, cel: [293, 1350, .66], kf: 1,
                  celhero: [241, 700, .8]};
const HERO = D.q('hero', '0') !== '0';          // o celular grande no meio, o palco azul e as vagas tracejadas (o anúncio "Edita o meu assim"); sem ele, o celular só sobe no fim
if (HERO) Object.assign(L, AR45 ? {kick: 60, kickx: 262, logo: [96, 160], nome: [122, 90], dentro: 320, cnt: 314, ag: [398, 514, 104], bt: 632, se: 748,
                                    pod: 1086, cel: [316, 866, .6], celhero: [301, 326, .64]} : {logo: [330, 226], nome: [330, 148], pod: 1500, cel: [250, 1340, .76]});
const T = {isso: .06, fabrica: .7, dentro: 2.05, a1: 2.85, a2: 3.7, toca: 4.6, aperta: 5.1, ...(() => { try { return JSON.parse(D.q('t', '{}')); } catch (e) { return {}; } })()};

Papel.monta('#papel', W, H, {luz: {a: [860, 520], b: [120, 1180], c: [170, 280]}});

$('kick').textContent = D.q('kick', 'ISSO É A');
$('kick').style.top = L.kick + 'px'; if (L.kickx) $('kick').style.left = L.kickx + 'px';   // 4:5: o chapéu vai em cima do nome, ao lado da marca
Object.assign($('pl').style, {top: L.logo[0] + 'px', width: L.logo[1] + 'px', height: L.logo[1] + 'px'});
$('pl').innerHTML = `<img src="${esc(D.q('img', '../midia/marca-fabrica.svg'))}" alt="">`;
const linhas = D.q('nome', 'Fábrica de|Conteúdo').split('|');
$('nome').innerHTML = linhas.map(l => esc(l)).join('<br>');
Object.assign($('nome').style, {left: (72 + L.logo[1] + 30) + 'px', top: L.nome[0] + 'px', fontSize: L.nome[1] + 'px'});
$('dentro').textContent = D.q('dentro', 'dentro do seu'); $('dentro').style.top = L.dentro + 'px'; $('dentro').style.fontSize = (66 * L.kf) + 'px';
Object.assign($('cnt').style, {top: L.cnt + 'px'});
const TERM = '<svg viewBox="0 0 60 60"><path d="M10 16l18 14-18 14" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 46h18" fill="none" stroke="var(--mk)" stroke-width="8" stroke-linecap="round"/></svg>';
[['a1', D.q('a1', 'Claude Code')], ['a2', D.q('a2', 'Codex')]].forEach(([id, nome], i) => {
  const e = $(id);
  e.style.top = L.ag[i] + 'px'; e.style.height = L.ag[2] + 'px';
  e.innerHTML = `<span class="ic2">${TERM}</span><span class="tx"><b>${esc(nome)}</b></span><span class="led"><span>LIVRE</span><i></i></span>`;
  const g = $('g' + (i + 1));
  g.style.top = L.ag[i] + 'px'; g.style.height = L.ag[2] + 'px';
  g.innerHTML = `<i></i><b style="font-weight:800">${esc(nome)}</b><span>LIVRE</span>`;
  g.style.setProperty('--gfs', L.agFs + 'px'); g.style.setProperty('--gic', L.ic + 'px');
});
$('bt').style.top = L.bt + 'px'; $('bt').style.height = 112 * L.kf + 'px';
document.head.insertAdjacentHTML('beforeend', `<style>.ag .tx{font-size:${L.agFs}px}.ag .ic2{width:${L.ic}px;height:${L.ic}px;border-radius:${L.ic * .24}px}.ag .ic2 svg{width:${L.ic * .66}px;height:${L.ic * .66}px}.ag .led{font-size:${AR45 ? 22 : 26}px}</style>`);
$('bt').innerHTML = esc(D.q('cta', 'Toca em *Saiba mais*')).replace(/\*(.+?)\*/g, '<b>$1</b>');
const PLANO = D.q('plano', '0') !== '0';
if (PLANO) { $('bt').classList.add('plano'); $('se').remove(); $('bt').innerHTML = $('bt').innerHTML.replace(/\|/g, '<br>'); document.head.insertAdjacentHTML('beforeend', '<style>#bt.plano{font-size:' + 80 * Math.min(L.kf, 1.1) + 'px}</style>'); }
if ($('se')) { $('se').style.top = L.se + 'px'; $('se').style.left = '470px'; }
const CEL = D.q('cel', '');
if (CEL) {
  if (HERO) {
    // o palco: um bloco azul embaixo, de onde o celular sai (cor, borda e sombra do núcleo; sem letra)
    const pd = document.createElement('div');
    pd.id = 'pod'; pd.className = 'nb cor-ac'; pd.style.cssText = `position:absolute;left:36px;width:1008px;top:${L.pod}px;height:${H - L.pod + 80}px;border-radius:48px;opacity:0`;
    $('mundo').appendChild(pd);
  }
  $('mundo').insertAdjacentHTML('beforeend', `<div id="cel"><img class="corpo" alt="" src="${esc(CEL)}"><div class="tela" id="cel-tela"></div><i class="cam"></i></div>`);
  const mv = D.midia('#cel-tela', D.q('celv', ''), 'editado');
  if (mv) mv.dataset.off = String(D.n('celv0', '0') + Q / 2);
}

D.monta(tl => {
  D.cabe('#nome', 60, [(W - 72 - L.logo[1] - 30 - 72) / W, 1]);   // a coluna do nome: a linha menos a marca e o vão
  D.cabe('#dentro', 44, .94);
  D.cabe('#bt', 44, .92);
  D.camera(dur, 1.0, 1.01);
  Papel.anda(tl, dur, {a: [820, 560], c: [200, 320]});

  /* B5: a marca pousa e o nome sobe, palavra por palavra na voz */
  // a marca pousa no alto e o nome sobe por palavra, na voz; o celular com o vídeo refeito já ocupa o meio do quadro (a prova do "isso")
  tl.fromTo('#kick', {opacity: 0, y: -14}, {opacity: 1, y: 0, duration: .3, ease: 'power3.out'}, D.at(T.isso));
  D.pousa('#pl', T.isso + .1, {som: 'pop', dy: -34});
  D.palavras('#nome', T.fabrica - .05, .2);
  D.marca('#nome i', T.fabrica + 1.2);
  D.pousa('#dentro', T.dentro, {dy: 30});
  // as vagas dos dois encaixes esperam, tracejadas, até cada um chegar
  if (HERO) {
    tl.fromTo(['#g1', '#g2'], {opacity: 0, y: 24}, {opacity: 1, y: 0, duration: .4, ease: 'power3.out', stagger: .1, immediateRender: false}, T.dentro - .28);
    tl.set('#g1', {opacity: 0}, T.a1 + .06); tl.set('#g2', {opacity: 0}, T.a2 + .06);
  }
  tl.fromTo('#cnt', {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: .3, ease: 'power3.out'}, D.at(T.dentro + .1));
  tl.set('#cnt .n b:nth-child(1)', {opacity: 1}, T.dentro + .15);
  // os dois encaixes: chegam de lado, em arco, e cada um acende o LED ao encaixar
  const encaixa = (id, t, n) => {
    D.pousa('#' + id, t, {dx: 460, dy: -12, som: 'thud'});
    const led = `#${id} .led i`, txt = `#${id} .led span`;
    tl.set(led, {backgroundColor: 'var(--ok)'}, t + .08);
    tl.call(() => { $(id).querySelector('.led span').textContent = 'CONECTADO'; $(id).querySelector('.led span').style.color = 'var(--ink)'; }, null, t + .08);
    tl.call(() => { $(id).querySelector('.led span').textContent = 'LIVRE'; $(id).querySelector('.led span').style.color = ''; }, null, t + .079);
    tl.fromTo(led, {scale: .5}, {scale: 1, duration: .3, ease: D.P.MOLA, immediateRender: false}, t + .08);
    D.marca(`#${id} .tx b`, t + .12);
    D.cue(t + .1, 'certo');
    tl.set(`#cnt .n b:nth-child(${n})`, {opacity: 0}, t + .1);
    tl.fromTo(`#cnt .n b:nth-child(${n + 1})`, {opacity: 0, scale: .6}, {opacity: 1, scale: 1, duration: .3, ease: D.P.MOLA, immediateRender: false}, t + .1);
  };
  encaixa('a1', T.a1, 1);
  encaixa('a2', T.a2, 2);

  /* B6: o botão assenta e é apertado; a seta aponta pra baixo; o celular sobe tocando o vídeo editado */
  D.pousa('#bt', T.toca, {som: 'pop'});
  if (!PLANO) tl.to('#bt', {x: D.SH * .7, y: D.SH * .7, '--shx': '0px', duration: 2 * Q, ease: 'power2.in'}, T.aperta);
  if (!PLANO) tl.to('#bt', {x: 0, y: 0, '--shx': D.SH + 'px', duration: .22, ease: D.P.POUSA}, T.aperta + 2 * Q);
  if (!PLANO) D.cue(T.aperta, 'click');
  D.marca('#bt b', T.aperta + .1);
  if ($('se')) tl.fromTo('#se', {opacity: 0, y: -34}, {opacity: 1, y: 0, duration: .35, ease: D.P.POUSA}, D.at(T.aperta + .22));
  const per = .7;
  for (let t = T.aperta + .6; t < dur - per; t += per)
    if ($('se')) tl.fromTo('#se', {y: 0}, {y: 18, duration: per / 2, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false}, t);
  if (CEL && HERO) {
    // o celular sobe do pé e assenta GRANDE no meio do quadro enquanto a marca se apresenta; no "dentro do seu" ele desce pro pé (espiando embaixo),
    // abrindo o lugar dos encaixes, e fica flutuando até o fim
    const c1 = L.cel, h = L.celhero, tc = T.isso + .08, vai = T.dentro - .5;
    gsap.set('#cel', {x: h[0], y: h[1], scale: h[2]});
    D.pousa('#pod', tc - .05, {dy: 420, som: 'papel'});
    tl.fromTo('#cel', {y: h[1] + 700, opacity: 1}, {y: h[1], duration: .7, ease: 'power3.out', immediateRender: false}, tc);
    tl.set('#cel', {opacity: 0}, 0); tl.set('#cel', {opacity: 1}, tc);
    D.cue(tc, 'whoosh');
    D.arco('#cel', vai, [h[0], h[1]], [c1[0], c1[1]], {dur: .6, flecha: 30, lado: 1});
    tl.to('#cel', {scale: c1[2], duration: .6, ease: 'power3.inOut'}, vai);
    D.cue(vai, 'whoosh');
    for (let t = vai + 1.0; t < dur - .8; t += 1.6)
      tl.fromTo('#cel', {y: c1[1]}, {y: c1[1] - 10, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false}, t);
  } else if (CEL) {
    const c1 = L.cel, tc = T.toca - .1;
    gsap.set('#cel', {x: c1[0], y: c1[1], scale: c1[2]});
    tl.fromTo('#cel', {y: c1[1] + 640, opacity: 1}, {y: c1[1], duration: .62, ease: 'power3.out', immediateRender: false}, tc);
    tl.set('#cel', {opacity: 0}, 0); tl.set('#cel', {opacity: 1}, tc);
    D.cue(tc, 'whoosh');
    for (let t = tc + .7; t < dur - .8; t += 1.6)
      tl.fromTo('#cel', {y: c1[1]}, {y: c1[1] - 10, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false}, t);
  }
  if (!PLANO) D.respira('#bt', T.aperta + .6, dur, 1.02);
  return dur;
});
</script>
</body>
</html>
