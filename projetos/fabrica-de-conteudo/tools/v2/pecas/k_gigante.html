<!DOCTYPE html>
<!-- TIPOGRAFIA — a frase gigante: a letra grande aprovada nos criativos (Anton), cheia no amarelo ou no azul, com a
     borda de tinta e a sombra dura. 1080x1920, --alpha. É a voz `gigante` da e_editorial (com `cor`) fora do ensaio:
     sem pessoa, por cima de qualquer cena. Esticada até a largura `larg` e a altura de letra `h`; as letras sobem da
     base uma a uma, um brilho passa por elas, o bloco aproxima devagar e sai subindo, mais rápido que entrou.
       l      a frase (uma linha) · cor  mk (amarelo) | ac (azul) | br (branco)
       y      o topo da tinta da letra, em px (300: a zona do Reels começa em 270) · h  a altura da letra (190)
       larg   a largura máxima (940) · t0 · sai  quando sai (-1: fica até o fim) · dur
       ?l=Você só pediu.&cor=mk&y=300&h=190&t0=0.1&sai=2.2&dur=2.6 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/editorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px;background:transparent}
#stage{padding:0;display:block;background:none}
.gig{position:absolute;left:0;top:0;filter:drop-shadow(10px 10px 0 var(--ink))}
.gs{width:max-content;white-space:nowrap;transform-origin:0 0}
.gig i{display:inline-block;font:400 100px/1 var(--ed-gig);font-style:normal;text-transform:uppercase;color:var(--mk);
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;transform-origin:50% 100%}
.gig.ac i{color:var(--ac)} .gig.br i{color:var(--pp)}
</style>
</head>
<body>
<div id="stage"><div class="gig" id="g"><div class="gs" id="gs"></div></div></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const g = document.getElementById('g'), gs = document.getElementById('gs'), frase = D.q('l', 'Você só pediu.');
const dur = D.n('dur', '2.6'), t0 = D.n('t0', '0.1'), sai = D.n('sai', '2.2');
g.classList.add(D.q('cor', 'mk'));
gs.innerHTML = [...frase].map(l => l === ' ' ? '<i>&nbsp;</i>' : `<i>${esc(l)}</i>`).join('');

D.monta(tl => {
  // a tinta da caixa alta medida no canvas, na letra de 100 px (o mesmo cálculo da voz gigante)
  const cx = document.createElement('canvas').getContext('2d');
  cx.font = '400 100px ' + D.css('--ed-gig').split(',')[0];
  const m = cx.measureText(frase.toUpperCase());
  const alt = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const topoTinta = 50 + (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 - m.actualBoundingBoxAscent;
  // o de dentro só estica, parado; o de fora (GSAP) anda: as duas escalas no mesmo nó brigariam
  const w0 = gs.getBoundingClientRect().width;
  const sy = D.n('h', '190') / alt, sx = Math.min(D.n('larg', '940') / w0, sy * 1.15);
  gs.style.transform = `scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  Object.assign(g.style, {left: (540 - w0 * sx / 2) + 'px', top: (D.n('y', '300') - topoTinta * sy) + 'px',
    width: w0 * sx + 'px', height: 100 * sy + 'px'});
  const ls = [...gs.children];
  tl.fromTo(ls, {yPercent: 70, scaleY: .5, opacity: 0}, {yPercent: 0, scaleY: 1, opacity: 1, duration: .4,
    ease: 'expo.out', stagger: .03}, D.at(t0));
  tl.fromTo(ls, {filter: 'brightness(1)'}, {filter: 'brightness(1.6)', duration: .09, ease: 'none', yoyo: true,
    repeat: 1, stagger: .04}, D.at(t0) + .36);
  const fim = sai >= 0 ? sai : dur;
  tl.fromTo('#g', {scale: 1}, {scale: 1.04, duration: Math.max(.1, fim - t0), ease: 'none', transformOrigin: '50% 100%'}, t0);
  D.cue(D.at(t0), 'whoosh'); D.cue(t0, 'impact');
  if (sai >= 0) {
    tl.to(ls, {yPercent: -40, opacity: 0, duration: .22, ease: 'power2.in', stagger: .012}, sai);
    D.cue(sai, 'whoosh-out');
  }
  return dur;
});
</script>
</body>
</html>
