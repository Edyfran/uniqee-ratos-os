<!DOCTYPE html>
<!-- EFEITO — painel lateral "NESTE VÍDEO": a lista do vídeo inteiro, fixa na lateral direita, com a linha da vez em
     barra cheia e o contador que muda. 1080x1920, --alpha. Fica na tela até o fim (data-qa="fica"): só entra, e a
     troca de linha é uma barra que anda em ~0,15 s, sem animar a lista. Padrão `tinta` (painel escuro sobre o
     vídeo); `?tema=claro` vira o painel branco da direção, com a barra de tinta.
       it    os nomes, separados por | (um por linha)
       ts    os segundos em que cada linha vira a atual, separados por vírgula (um por nome; sem eles, 1,1 s por linha)
       kick  o cabeçalho (NESTE VÍDEO) · foot  o rodapé (vira marcador amarelo na última linha)
       x  y  w  o canto superior esquerdo e a largura do painel (690, 300, 358) · lh  a altura de cada linha (37)
       quieto  1 = já na tela no quadro 0, sem entrada (0)
       t0  quando entra (0.1) · dur  (sem ele: o último tempo + 1.3)
       ?it=Gancho cinético|Queda livre|Legenda gigante|Barra de pedido|Storyboard|Ícone riscado&ts=0.2,1.3,2.4,3.5,4.6,5.7&foot=%2B100 animações&kick=NESTE VÍDEO&t0=0.1 -->
<html lang="pt-BR" class="alfa" data-qa="fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
html{--txf:var(--ink6); --txp:var(--ink4); --txc:#fff; --barra:var(--ink); --rod:var(--ink6)}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
html.tinta{--txf:var(--cod-tx); --txp:#7C808B; --txc:var(--ink); --barra:#fff; --rod:var(--cod-cm)}
.pn{position:absolute;padding:14px 12px 14px;overflow:visible}
html.tinta .pn{background:rgba(11,13,18,.9);border-color:#3B3F4A}
.cab{display:flex;justify-content:space-between;align-items:center;padding:2px 12px 12px;font:700 18px/1 var(--fm);letter-spacing:.14em;
  color:var(--txf);text-transform:uppercase;border-bottom:3px solid var(--txp);margin-bottom:10px}
.cab .ct{position:relative;width:96px;height:18px}
.cab .ct span{position:absolute;right:0;top:0;opacity:0;white-space:nowrap;letter-spacing:.06em}
.ls{position:relative}
.bar{position:absolute;left:0;top:0;width:100%;background:var(--barra);border-radius:var(--raio-s);opacity:0}
.ln{position:relative;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap}
.ln i{font:600 16px/1 var(--fm);font-style:normal;color:var(--txf);width:26px;flex:none}
.ln b{font:700 24px/1 var(--fd);letter-spacing:-.02em;color:var(--txf)}
.rod{margin:12px 6px 0;padding:10px 12px;font:700 19px/1 var(--fm);letter-spacing:.06em;color:var(--rod);border-radius:var(--raio-s);
  text-transform:uppercase;white-space:nowrap;border-top:0}
</style>
</head>
<body>
<div id="stage"><div class="pn nb" id="pn">
  <div class="cab"><span id="kk"></span><div class="ct" id="ct"></div></div>
  <div class="ls" id="ls"><div class="bar" id="bar"></div></div>
  <div class="rod" id="rod"></div>
</div></div>
<script>
// o padrão deste Reel é o painel escuro; só `?tema=claro` é papel
if (D.q('tema', 'tinta') !== 'claro') document.documentElement.classList.add('tinta');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const $ = id => document.getElementById(id);
const nomes = D.q('it', 'Gancho cinético|Queda livre|Legenda gigante|Barra de pedido|Storyboard|Ícone riscado|Solta o arquivo|Linha do tempo|Treme e apaga|Antes e depois|Conta-gotas|Visual de filme|Cartela de título|Grade rodando|Feed de verdade|Cartão de vídeo|Chamada pro comentário|Comenta EDITA')
  .split('|').map(s => s.trim()).filter(Boolean);
const N = nomes.length, lh = D.n('lh', '37'), t0 = D.n('t0', '0.1');
const ts0 = D.q('ts', '').split(',').filter(Boolean).map(Number);
const ts = nomes.map((_, i) => ts0.length === N ? ts0[i] : .2 + i * 1.1);
const dur = D.n('dur', String(Math.round((ts[N - 1] + 1.3) * 100) / 100));
const pad2 = n => String(n).padStart(2, '0');
$('kk').textContent = D.q('kick', 'NESTE VÍDEO');
$('rod').textContent = D.q('foot', '+100 animações');
$('ct').innerHTML = nomes.map((_, i) => `<span>${pad2(i + 1)} / ${pad2(N)}</span>`).join('');
$('ls').insertAdjacentHTML('beforeend', nomes.map((n, i) => `<div class="ln" style="height:${lh}px"><i>${pad2(i + 1)}</i><b>${esc(n)}</b></div>`).join(''));
$('bar').style.height = lh + 'px';
Object.assign($('pn').style, {left: D.n('x', '690') + 'px', top: D.n('y', '300') + 'px', width: D.n('w', '358') + 'px'});

D.monta(tl => {
  const ln = [...document.querySelectorAll('.ln')], cs = [...document.querySelectorAll('#ct span')];
  const cor = (el, v, t, d = .1) => tl.to(el, {color: v, duration: d, ease: 'none'}, t);
  const css = D.css;
  if (D.n('quieto', '0') < 1) D.pousa('#pn', t0, {dx: 70, dy: 0, dr: 0});
  const tt = ts.map(D.at);
  // antes da 1ª troca nenhuma linha é a atual; o contador já mostra 01
  tl.set(cs[0], {opacity: 1}, 0);
  ln.forEach((l, i) => {
    const t = tt[i], gap = i + 1 < N ? tt[i + 1] - t : .3, d = Math.max(.05, Math.min(.15 * (1 + .14 * ((i * 5) % 3 - 1)), gap - .02));
    const i1 = l.querySelector('i'), b = l.querySelector('b');
    // a linha vira a atual: texto invertido sobre a barra
    cor([i1, b], css('--txc'), t, d);
    // e, ao passar, escurece (passada)
    if (i + 1 < N) cor([i1, b], css('--txp'), tt[i + 1], d);
    if (i === 0) tl.fromTo('#bar', {opacity: 0, y: 0}, {opacity: 1, duration: d, ease: 'none'}, t);
    else tl.to('#bar', {y: i * lh, duration: d, ease: 'power3.out'}, t);
    if (i > 0) { tl.set(cs[i - 1], {opacity: 0}, t); tl.set(cs[i], {opacity: 1}, t); }
  });
  // o rodapé vira marcador na última linha
  tl.to('#rod', {backgroundColor: css('--mk'), color: css('--ink'), duration: .15, ease: 'none'}, tt[N - 1]);
  tl.fromTo('#rod', {scale: 1}, {scale: 1.06, duration: .1, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: '0 50%'}, tt[N - 1]);
  D.cue(ts[N - 1], 'marca');
  return dur;
});
</script>
</body>
</html>
