const sv = cv2(1400, 2240); { const g = sv.getContext('2d'); g.filter = 'blur(46px)'; g.fillStyle = '#000'; g.fillRect(160, 190, 1080, 1920); }
const sombraM = mk(tex(sv), 1400, 2240, 0, -34, -2, .75); sombraM.renderOrder = -2;
const mold = new T.Mesh(new T.PlaneGeometry(1080 + 28, 1920 + 28), new T.MeshBasicMaterial({color: 0x050608, transparent: true, depthWrite: false})); mold.position.set(0, 0, 1); mold.renderOrder = 1; plano.add(mold);
const telaV = new T.Mesh(new T.PlaneGeometry(1080, 1920), new T.MeshBasicMaterial({map: texVid, transparent: true, toneMapped: false, depthWrite: false})); telaV.position.set(0, 0, 2); telaV.renderOrder = 2; plano.add(telaV);

function quadroQ(q) {
  const s = esc(q), d = FOCAL / s;
  const gi = giro(q); camera.position.set(AX + 1.35 * gi, AY + 2.7 * gi, d); camera.rotation.set(0, 0, 0);
  telaV.position.x = mold.position.x = sombraM.position.x = 1.2 * gi;      // o monitor não anda pro lado na ref (0,0 px por quadro): ele cancela 90% do giro em x; em y e na escala acompanha o resto
  plano.rotation.set(PIT * RAD, YAW * RAD, ROL * RAD);
  renderer.render(scene, camera);
}
function dinamicos(q, t) {
  atualizaVideo(); desenhaPaineis(q); desenhaTempo(TV + Math.max(0, q) / 30);
  texPan.needsUpdate = true; texTime.needsUpdate = true; texVid.needsUpdate = true;
}
function quadro(t) {
  const q = t * 30 + 1e-6;
  dinamicos(q, t);
  actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1; actx.clearRect(0, 0, W, H); actx.fillStyle = GR.cine; actx.fillRect(0, 0, W, H);
  const rapido = q < 7.4;
  if (!rapido || KSUB < 2) { quadroQ(q); actx.drawImage(glc, 0, 0); return; }
  const tmp = quadro.tmp || (quadro.tmp = cv2(W, H)), tx = tmp.getContext('2d'); tx.globalCompositeOperation = 'source-over';
  const obt = q < 3 ? 1.0 : .7;
  tx.clearRect(0, 0, W, H); tx.globalCompositeOperation = 'lighter';
  actx.globalCompositeOperation = 'source-over'; actx.fillStyle = GR.cine; actx.fillRect(0, 0, W, H);
  // a média dos subquadros: a câmera anda dentro do obturador (borrão radial de verdade); o fundo preto vai por baixo, depois da média
  tx.clearRect(0, 0, W, H); tx.globalAlpha = 1 / KSUB;
  for (let i = 0; i < KSUB; i++) { quadroQ(q + (i / (KSUB - 1) - .5) * obt); tx.drawImage(glc, 0, 0); }
  tx.globalAlpha = 1; tx.globalCompositeOperation = 'source-over';
  const desf = 7 * (1 - prog(q, 1.2, 5.2));                                 // o editor chega fora de foco e assenta em 3 a 4 quadros
  actx.filter = desf > .3 ? `blur(${desf.toFixed(1)}px)` : 'none'; actx.drawImage(tmp, 0, 0); actx.filter = 'none';
}

Promise.all([carregaAudio(ONDA), carregaMiniaturas(), document.fonts.load('700 50px ' + FD), document.fonts.load('800 40px ' + FD), document.fonts.load('600 36px "IBM Plex Mono"')]).then(([p]) => {
  PICOS = p; desenhaTitulo();
  D.monta(tl => {
    tl.to({}, {duration: dur}, 0);
    D.aoQuadro(() => quadro(tl.time()));
    if (vid) vid.addEventListener('seeked', () => quadro(tl.time()));
    renderer.compile(scene, camera); quadro(0);
    D.cue(0, 'whoosh'); CK.forEach(q => D.cue(q / 30, 'pop'));
    return dur;
  });
});
