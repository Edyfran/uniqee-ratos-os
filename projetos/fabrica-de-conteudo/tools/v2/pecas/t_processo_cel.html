<!DOCTYPE html>
<!-- TIPO — o processo que fica pro celular, v2. 1080x772 (a faixa de cima da cena 9:16, sem reduzir).
     Duas fichas EMPILHADAS e uma ponte vertical: a primeira não sai quando a segunda entra. O selo bate torto na ficha.
     Nome e detalhe a 58 px ou mais.
       ?de=Seu processo&de_det=escrito uma vez&para=Próxima execução&para_det=já sabe o caminho&salvo=Salvo&dur=4 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:772px}
#stage{padding:34px 54px;justify-content:center}
.kick{font-size:44px;padding:10px 18px}
.hd{font-size:76px;margin:20px 0 24px}
.trilho{display:flex;flex-direction:column;align-items:stretch}
.fx{padding:14px 28px;opacity:0;position:relative}
.fx .nm{font:900 64px/1.08 var(--fd);color:var(--ink);letter-spacing:var(--ls);white-space:nowrap}
.fx .de{font:600 58px/1.15 var(--fd);color:var(--ink6);white-space:nowrap}
.selo{position:absolute;right:-8px;top:-22px;display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;opacity:0;border-radius:var(--raio-s)}
.selo b{font:800 40px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase}
.selo i{font:900 36px/1 var(--fd);font-style:normal}
.ponte{height:40px;flex:none;position:relative;display:flex;justify-content:center}
.ponte .fio{width:12px;height:100%;background:var(--ink);transform-origin:center top}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="hd" id="h"></div>
  <div class="trilho">
    <div class="nb fx" id="a">
      <div class="nm" id="an"></div><div class="de" id="ad"></div>
      <span class="selo nb cor-mk" id="sl"><i>✓</i><b id="slb"></b></span>
    </div>
    <div class="ponte"><div class="fio" id="fio"></div></div>
    <div class="nb fx" id="b"><div class="nm" id="bn"></div><div class="de" id="bd"></div></div>
  </div>
</div>
<script>
const dur = D.n('dur', '4');
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('h').innerHTML = D.q('hd', '');
document.getElementById('an').textContent = D.q('de', 'Seu processo');
document.getElementById('ad').textContent = D.q('de_det', '');
document.getElementById('bn').textContent = D.q('para', 'Próxima execução');
document.getElementById('bd').textContent = D.q('para_det', '');
document.getElementById('slb').textContent = D.q('salvo', 'Salvo');
const tA = D.n('t_a', '0.10'), tS = D.n('t_selo', '1.5'), tL = D.n('t_linha', '0.7'), tB = D.n('t_b', '1.0');

D.monta(tl => {
  D.cabe('.hd', 58);
  D.cabe('.fx .nm', 58, '.fx');
  D.cabe('.fx .de', 58, '.fx');
  D.camera(dur, 1.0, 1.02);
  if (D.q('kick')) D.carimbo('#k', .06);
  if (D.q('hd')) D.titulo('#h', .18);
  D.pousa('#a', tA, {dx: -36, rot: D.inclina(0) * .5});
  if (D.q('salvo')) D.carimbo('#sl', tS, D.P.ROT - 3);
  tl.fromTo('#fio', {scaleY: 0}, {scaleY: 1, duration: .3, ease: D.P.EASE}, D.at(tL));
  D.pousa('#b', tB, {dx: 36, rot: D.inclina(1) * .5});
  D.sai(['#k', '#h', '#a', '.ponte', '#b'], dur - .45);
  return dur;
});
</script>
</body>
</html>
