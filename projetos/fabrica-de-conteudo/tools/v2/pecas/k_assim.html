<!-- TIPOGRAFIA + INTERFACE — o anúncio "Edita o meu assim" (B1 a B4), num palco só: os dois cartões (REFERÊNCIA e SEU VÍDEO)
     atravessam as batidas, então não há emenda entre elas. A mecânica do original (Dd990J6ADQk), no nosso visual:
       1. o pedido: o título sobe palavra a palavra, o cartão da referência pousa, o campo do Claude Code abre, o vídeo
          dele chega em arco ao 2/2 e a frase se escreve no campo enquanto estoura em letra gigante ("EDITA O MEU ASSIM");
       2. a leitura: a referência passa na leitura rápida (os cortes viram marcas numa régua, um por um) e a ficha de
          estilo se enche, uma linha por vez, no instante em que a voz a diz: ritmo, lugar da legenda, cor, palavras por linha,
          zoom, cada uma com a marca desenhada em cima do vídeo da referência;
       3. o seu vídeo: a pausa do bruto passa rápido e é cortada, e a ficha ganha a coluna dele, linha a linha;
       4. o ajuste: a linha da legenda vira ✗ (66 % contra 82 %), o pedido se escreve no campo e o mesmo instante do vídeo
          refeito mostra a legenda mais embaixo (77 %).
     Os dois vídeos dos cartões chegam prontos, no relógio do peça (o quadro n do arquivo é o quadro n da peça): o `anuncio.py`
     monta cada um com os trechos da referência e do vídeo dele, e os números da ficha são os do `referencia.py le` e do `compara`.
     1080x1920 e 1080x1350 (`?ar=1080x1350`: o desenho do 4:5 é outro, não o 9:16 cortado). Texto que se lê dentro da área
     segura do anúncio (x 65–1015, y 270–1250; no 4:5, o quadro com 54 de margem); o vídeo dos cartões enche o resto.
     Movimento do núcleo (os 12 princípios): o cartão pousa (D.pousa), o vídeo vem em arco (D.arco, D.cursor), a frase se escreve
     no ritmo de mão (D.digita), o herói estoura com antecipação (D.heroi), cascata de 2–3 quadros nas linhas da ficha.
       ref, seu  os vídeos dos cartões (600x1066, 30 qps, do tamanho da peça) · t  os instantes (JSON; o anuncio.py lê a voz e passa)
       ticks  os cortes da referência, em s, e dur_ref (15) · tit1  o título do pedido (linhas por |; *marcador*, ~azul~; sem palavrão: o Meta proíbe palavrão em anúncio)
       dur  a duração da peça · v  os números da ficha (JSON)
       ?ref=../../videos/x/cartao-ref.mp4&seu=../../videos/x/cartao-seu.mp4&dur=21.47 -->

const json = (k, d) => { try { return {...d, ...JSON.parse(D.q(k, '{}'))}; } catch (e) { return d; } };

/* ── o desenho de cada quadro: o 9:16 e o 4:5 são duas composições, não uma cortada ── */
const L = AR45 ? {
  hud: [54, 54], tit: 112, titFs: 86, tit1: 62, tit1Fs: 100, sub1: [276, 46], g1: [56, 100], g2: [178, 228],
  campo: {y: 420, h: 150, x: 65}, colh: 214,
  rows: {y: 246, h: 68, gap: 8, v: 44},
  cards: {y: 724, w: 436, hdr: 40, bh: 516, x: [65, 579]},
  hero: {y: -200, s: 1.45}, b4: {y: -90, s: 1.15}, cb: 378,
} : {
  hud: [65, 272], tit: 334, titFs: 96, tit1: 280, tit1Fs: 120, sub1: [650, 56], g1: [276, 128], g2: [396, 290],
  campo: {y: 736, h: 160, x: 65}, colh: 452,

const C = L.cards, RH = L.rows.h;
const TM = json('t', {b2: 4.87, lugar: 7.02, cor: 8.13, pal: 8.78, zoom: 10.18, b3: 11.47, ff: 12.57, corta: 13.98, z: 16.83, b4: 18.35, pede: 19.54, ajusta: 20.37,

  return [(C.w - vw) * .5 + fx * vw, (C.bh - vh) * ANC + fy * vh];

  $('cRef-c').appendChild(e); return e;
});

  tl.to('#cRef', {scale: L.b4.s, y: L.b4.y, duration: .5, ease: 'power3.inOut'}, T.b4 + .03);
  // as linhas somem, menos a das peças, que sobe pro primeiro lugar
  ['ritmo', 'lugar', 'cor', 'pal', 'zoom'].forEach((id, i) => tl.to('#l-' + id, {opacity: 0, y: -30, scale: .96, duration: .2, ease: 'power2.in'}, T.b4 + .02 + i * 2 * Q));
  tl.to('#l-pecas', {y: -(RH + L.rows.gap), duration: .4, ease: 'power3.inOut'}, T.b4 + .12);
  tl.to('#colh', {opacity: 0, duration: .15, ease: 'none'}, T.b4);
  tl.call(() => { estado('pecas', 'no', NO); preenche('s-pecas', V.pecas[2], V.n.v1 + ' peças contra ' + V.n.ref); }, null, w.parecido + .12);
  tl.call(() => { estado('pecas', 'mid', MID); preenche('s-pecas', V.pecas[2], V.pecas[3]); }, null, w.parecido + .12 - .001);
  D.cue(w.parecido + .12, 'erro');
  // a guia: o painel dele, com menos peças que o da referência
  marca([bSeu], T.b4 + .4, dur + 1, {de: 1.15});
  // o pedido se escreve no campo
  const cb = L.cb ?? L.rows.y + RH + 26;
  tl.set('#campo', {top: cb}, T.b2 + .4);
  $('msg').dataset.p2 = 'põe mais peças no painel';
  D.pousa('#campo', T.pede - .3, {dy: 80, som: 'papel'});
  tl.set('#msg', {}, T.pede - .3);
  // o campo da B4 é outro texto: o 2º #msg entra depois que o 1º sai
  const msg2 = document.createElement('div'); msg2.id = 'msg2'; msg2.textContent = 'põe mais peças no painel';
  msg2.style.cssText = 'position:absolute;left:28px;right:110px;top:0;font:600 50px/' + (CP.h - 58 - 8) + 'px var(--fd);letter-spacing:-.01em;color:var(--ink);white-space:pre;opacity:0';
  $('caixa').appendChild(msg2);
  tl.set('#msg', {opacity: 0}, T.b2 - .01);
  tl.set(msg2, {opacity: 1}, T.pede - .3);
  const fim2 = D.digita('#msg2', T.pede, .034);
  tl.to('#cnt', {opacity: 0, duration: .1}, T.pede - .3);
  tl.to('#tab', {opacity: 1}, T.pede - .3);
  const ey2 = cb + 56 + (CP.h - 58) / 2;
  D.cursor('#mundo', [{x: ex - 90, y: ey2 + 360, t: T.ajusta - .72}, {x: ex, y: ey2, t: T.ajusta - .04, clica: true, alvo: '#env'}], {sai: T.ajusta + .3});
  tl.fromTo('#env', {scale: .5, opacity: 0}, {scale: 1, opacity: 1, duration: .25, ease: D.P.MOLA, immediateRender: false}, T.pede - .1);
  // o vídeo refeito: o mesmo instante, com mais peças no painel; a caixa vermelha vira verde e a linha das peças fecha
  tl.set(bSeu, {borderColor: 'var(--ok)'}, T.ajusta + .06);
  tl.call(() => { estado('pecas', 'ok', OK); preenche('s-pecas', V.pecas[4], V.pecas[5]); }, null, T.ajusta + .1);
  tl.fromTo('#e-pecas', {scale: .4}, {scale: 1, duration: .3, ease: D.P.MOLA, immediateRender: false}, T.ajusta + .1);
  tl.fromTo('#s-pecas b', {backgroundSize: '0% 80%'}, {backgroundSize: '100% 80%', duration: .4, ease: 'power3.inOut', immediateRender: false}, T.ajusta + .12);
  D.cue(T.ajusta + .06, 'stamp'); D.cue(T.ajusta + .12, 'certo');
  return dur;
});
</script>
