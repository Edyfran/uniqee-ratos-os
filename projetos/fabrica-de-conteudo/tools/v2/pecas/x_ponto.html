<!DOCTYPE html>
<!-- TRANSIÇÃO — o ponto: a tela recua até virar um ponto, o ponto salta e abre a próxima. 1080x1920 ou
     1920x1080 (?ar=), --alpha.
     O papel fecha em volta do vídeo numa janela de borda tinta que encolhe, arredonda e vira um ponto
     em `de`. No `meio` só o ponto está na tela, o quadro inteiro coberto: ali cai o corte do vídeo por
     baixo (window.__corte). O ponto salta em arco até `para`, e de lá a janela abre de novo, já com o
     vídeo seguinte, até sair pela borda. Da referência (Skillry #262, a tela que recua até virar um
     ponto e reabre noutra) saiu só o movimento: aqui o vídeo não encolhe, é o papel que fecha.
       de, para  "x,y" em fração do quadro: onde o ponto nasce e de onde a janela reabre
       meio  o instante coberto (0.6) · dur
       ?de=0.32,0.38&para=0.68,0.62&meio=0.6&dur=1.5 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html,body{background:transparent}
#stage{position:relative;overflow:hidden;background:none;padding:0;display:block}
#capa{position:absolute;inset:0;background:var(--tex),var(--pp)}
#borda{position:absolute;border:8px solid var(--ink);box-sizing:border-box}
#ponto{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;opacity:0}
</style>
</head>
<body>
<div id="stage"><div id="capa"></div><div id="borda"></div><div class="nb cor-ink" id="ponto"></div></div>
<script>
const R = document.documentElement, HZ = D.q('ar', '1080x1920').startsWith('1920');
if (HZ) R.classList.add('h');
const W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920, BW = 8;
const xy = (k, d) => { const [x, y] = D.q(k, d).split(',').map(Number); return [x * W, y * H]; };
const [dx, dy] = xy('de', '0.32,0.38'), [px, py] = xy('para', '0.68,0.62');
const E = .5, SALTO = .32;
const meio = Math.max(E + .05, D.n('meio', '0.6'));
const dur = Math.max(meio + SALTO + E + .05, D.n('dur', '1.5'));
window.__corte = meio;
const capa = document.getElementById('capa'), borda = document.getElementById('borda');
// J é a janela: o centro e a escala (1,04 é um pouco maior que o quadro: a borda fica de fora)
const J = {x: W / 2, y: H / 2, s: 1.04};
const ret = (x, y, w, h, r) => `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
const desenha = () => {
  const w = W * J.s, h = H * J.s, x = J.x - w / 2, y = J.y - h / 2;
  // o raio cresce enquanto ela encolhe: no fim, a janela é uma pílula do tamanho do ponto
  const r = Math.min(w, h) / 2 * Math.min(1, Math.max(0, (1 - J.s) * 1.3)) + 18 * Math.min(1, J.s * 4);
  const rr = Math.min(r, w / 2, h / 2);
  capa.style.clipPath = `path(evenodd, 'M0 0H${W}V${H}H0Z${ret(x, y, w, h, rr)}')`;
  Object.assign(borda.style, {left: x - BW + 'px', top: y - BW + 'px', width: w + 2 * BW + 'px', height: h + 2 * BW + 'px',
    borderRadius: rr + BW + 'px', opacity: J.s > .004 ? 1 : 0});
};

D.monta(tl => {
  D.aoQuadro(desenha);
  // fecha: a janela recua até o ponto, acelerando
  tl.fromTo(J, {x: W / 2, y: H / 2, s: 1.04}, {x: dx, y: dy, s: 0, duration: E, ease: 'power3.in'}, meio - E);
  D.cue(meio - E, 'whoosh');
  // o ponto assume quando a janela fica do tamanho dele, e salta em arco até o outro lado
  const P = document.getElementById('ponto'), A = {k: 0};
  tl.fromTo(P, {opacity: 0, scale: .5}, {opacity: 1, scale: 1, duration: .06, ease: 'power2.out'}, meio - .06);
  D.cue(meio, 'pop');
  // antes do salto o ponto acompanha o centro da janela que fecha; no salto, o arco
  D.aoQuadro(() => gsap.set(P, A.k > 0 ? {left: dx + (px - dx) * A.k, top: dy + (py - dy) * A.k - Math.sin(Math.PI * A.k) * Math.min(W, H) * .22}
    : {left: J.x, top: J.y}));
  tl.fromTo(A, {k: 0}, {k: 1, duration: SALTO, ease: 'power2.inOut'}, meio);
  D.cue(meio + .05, 'swish');
  // abre: do ponto a janela cresce até sair pela borda, voltando ao centro do quadro
  tl.fromTo(J, {x: px, y: py, s: 0}, {x: W / 2, y: H / 2, s: 1.04, duration: E, ease: 'power3.out', immediateRender: false}, meio + SALTO);
  tl.to(P, {scale: 1.8, opacity: 0, duration: .14, ease: 'power2.out'}, meio + SALTO + .02);
  D.cue(meio + SALTO, 'whoosh-out');
  return dur;
});
</script>
</body>
</html>
