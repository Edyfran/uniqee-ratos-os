    k.g.position.set(px - BXF, BYF - py, z); k.g.scale.setScalar(s * (1 + CK.s0 * Math.exp(-Math.max(0, q - QB - k.de) / CK.ts)));   // os cacos nascem maiores (placas que se partem) e chegam ao tamanho certo em ~2 quadros
    const tq = (q - QB - k.de) * 10 / (10 - k.de), ang = k.w * RAD * (CK.rot * gg + CK.rot2 * Math.pow(Math.max(0, tq - CK.ta), 2) / 2); k.g.rotation.set(k.ax[0] * ang * 1.6, k.ax[1] * ang * 1.6, k.ax[2] * ang);
    nrm.set(0, 0, 1).applyEuler(k.g.rotation); if (nrm.z < 0) nrm.negate();
    const sh = CK.la + CK.ld * Math.max(0, nrm.dot(LUZ)); k.mat.color.setRGB(k.b * sh, k.b * sh * .98, k.b * sh * .86);
    const ys = BYF + (py - BYF) * S, fe = CK.fe * clamp((ys - 30) / 250, 0, 1);                      // quem está mais embaixo (perto da cabeça) some antes; os cacos do alto, nos cantos, ficam até f371
    const xs = BXF + (px - BXF) * S, fn = (k.near ? CK.fnear : 0) - CK.fx * clamp((xs - 540) / 540, -1, 1);   // o grupo de perto some antes, o lado direito um pouco depois do esquerdo (a ref esvazia a esquerda primeiro); perto das bordas do quadro o vidro some (a ref não solta cacos pelos lados)
    const op = (CK.o0 + (1 - CK.o0) * sm(prog(q, QB + k.de, QB + k.de + 1.2))) * (1 - sm(prog(q, QB + CK.f0 - fe - fn, QB + CK.f1 - fe - fn))) * (1 - CK.vg * sm(clamp((Math.abs(xs - 540) - CK.xv0) / (CK.xv1 - CK.xv0), 0, 1)) * sm(clamp((ys - CK.vy0) / (CK.vy1 - CK.vy0), 0, 1)));
    k.mat.opacity = op; k.g.children[0].material[1].opacity = op;
  });
}

// as rachaduras finas de f359: uma teia irregular no alto à direita, fora do rosto (px do vídeo)
const RACHA = (() => { const r = rng(33), O = D.q('rach', '800,300').split(',').map(Number), L = []; 
  for (let k = 0; k < 9; k++) { const ang = (-Math.PI * .95 + k * (Math.PI * .95 / 8)) + (r() - .5) * .25 - .1, n = 3 + Math.floor(r() * 3), comp = 150 + r() * 230; let x = O[0], y = O[1], a = ang; const pts = [[x, y]];
    for (let i = 0; i < n; i++) { a += (r() - .5) * .55; x += Math.cos(a) * comp / n; y += Math.sin(a) * comp / n; pts.push([x, y]); }
    L.push(pts); if (r() < .6) { const j = 1 + Math.floor(r() * (pts.length - 1)); let a2 = a + (r() < .5 ? -1 : 1) * (.5 + r() * .5), x2 = pts[j][0], y2 = pts[j][1]; const q2 = [[x2, y2]]; for (let i = 0; i < 2; i++) { x2 += Math.cos(a2) * 55; y2 += Math.sin(a2) * 55; a2 += (r() - .5) * .5; q2.push([x2, y2]); } L.push(q2); } }
  for (let k = 0; k < 3; k++) { const rr_ = 70 + k * 60, pts = []; for (let i = 0; i <= 6; i++) { const a = -Math.PI * .95 + i * (Math.PI * .85 / 6) + (r() - .5) * .1, rad = rr_ * (.85 + r() * .3); pts.push([O[0] + Math.cos(a) * rad, O[1] + Math.sin(a) * rad]); } L.push(pts); }
  return L; })();

// ---- a interface de Reels, em px do quadro com o cartão a 0,60 (o app de verdade: ícones de traço fino, Seguir de contorno) ----
function interface_(g, q, ox, oy) {
  const a = prog(q, 4.6, 5.4); if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.translate(ox, oy);
  const BR = '#fff';
  g.fillStyle = BR; g.font = '700 23px system-ui, -apple-system, sans-serif'; g.textBaseline = 'alphabetic'; g.fillText('Reels', 255, 240);
  // câmera
  g.strokeStyle = BR; g.lineWidth = 2.8; g.lineJoin = 'round'; g.lineCap = 'round'; g.save(); g.translate(835, 230); g.scale(1.4, 1.4); g.lineWidth = 2; g.beginPath(); g.roundRect(-13, -10, 26, 20, 5); g.stroke(); g.beginPath(); g.arc(0, 0, 6, 0, 7); g.stroke(); g.beginPath(); g.moveTo(-6, -10); g.lineTo(-4, -14); g.lineTo(4, -14); g.lineTo(6, -10); g.stroke(); g.restore();
  // coluna da direita: ícones de traço fino a 1,6x do que eu tinha (a ref mede uns 30 px)
  const X = 827, ic = (cx, cy, f) => { g.save(); g.translate(cx, cy); g.scale(1.6, 1.6); g.lineWidth = 1.75; g.strokeStyle = BR; g.fillStyle = BR; f(); g.restore(); };
  ic(X, 972, () => { g.beginPath(); g.moveTo(0, 12); g.bezierCurveTo(-24, -4, -20, -20, -8, -20); g.bezierCurveTo(-2, -20, 0, -15, 0, -12); g.bezierCurveTo(0, -15, 2, -20, 8, -20); g.bezierCurveTo(20, -20, 24, -4, 0, 12); g.stroke(); });     // coração
  ic(X, 1067, () => { g.beginPath(); g.arc(0, -1, 13, .45 * Math.PI, 2.45 * Math.PI, false); g.lineTo(-13, 14); g.lineTo(-6, 10); g.closePath(); g.stroke(); });                                                       // comentário
  ic(X, 1156, () => { g.beginPath(); g.moveTo(-14, -8); g.lineTo(15, 0); g.lineTo(-12, 10); g.lineTo(-6, 0); g.closePath(); g.stroke(); g.beginPath(); g.moveTo(-6, 0); g.lineTo(15, 0); g.stroke(); });                // enviar
  ic(X, 1228, () => { [-9, 0, 9].forEach(x => { g.beginPath(); g.arc(x, 0, 2.3, 0, 7); g.fill(); }); });                                                                                                      // três pontos na horizontal
  // gradiente embaixo do cartão
  const gr = g.createLinearGradient(0, 1130, 0, 1332); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = gr; g.fillRect(236, 1130, 648, 202);
  // avatar, nome, seguir, legenda
  g.save(); g.beginPath(); g.arc(288, 1206, 27, 0, 7); g.clip(); g.fillStyle = GR.i8; g.fillRect(260, 1178, 56, 56);
  if (avimg.naturalWidth) { const s = Math.max(56 / avimg.naturalWidth, 56 / avimg.naturalHeight); g.drawImage(avimg, 288 - avimg.naturalWidth * s / 2, 1206 - avimg.naturalHeight * s / 2, avimg.naturalWidth * s, avimg.naturalHeight * s); } g.restore();
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; g.beginPath(); g.arc(288, 1206, 27, 0, 7); g.stroke();
  g.fillStyle = BR; g.font = '700 21px system-ui, -apple-system, sans-serif'; g.fillText(NOME, 327, 1212); const nw = g.measureText(NOME).width;
  g.strokeStyle = BR; g.lineWidth = 1.8; g.beginPath(); g.roundRect(327 + nw + 14, 1186, 18 + g.measureText(SEG).width + 16, 32, 9); g.stroke(); g.font = '600 18px system-ui, -apple-system, sans-serif'; g.fillText(SEG, 327 + nw + 14 + 14, 1208);
  g.font = '500 21px system-ui, -apple-system, sans-serif'; g.fillText(LEG, 265, 1268);
  g.restore();
}

// ---- um quadro ----
function trajeto(g, x0, y0, s, q) { g.beginPath(); g.roundRect(x0, y0, W * s, H * s, 28); }
const RUIDO = (() => { const c = cv2(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256); const r = rng(7); for (let i = 0; i < d.data.length; i += 4) { const v = Math.floor(r() * 255); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
let nQuadro = 0, bgKey = ''; const bgc = cv2(W, H), bgg = bgc.getContext('2d');
function fundo(q, estourou) {                                    // o fundo escuro e borrado: só muda de um quadro pro outro, não entre os subquadros (o desfoque de 96 px é o que pesa)
  const ab = sm(prog(q, .1, 1.3)), key = nQuadro + '|' + (estourou ? 1 : 0) + '|' + ab.toFixed(3); if (key === bgKey) return bgc; bgKey = key;
  bgg.clearRect(0, 0, W, H); bgg.save(); bgg.globalAlpha = ab; bgg.filter = 'blur(' + (estourou ? 96 : 70) + 'px) grayscale(.75) brightness(1.9)'; bgg.drawImage(wcv, -260, -420, W + 520, H + 840); bgg.restore();   // o vídeo sem a pessoa, mole e cinza
  bgg.fillStyle = `rgba(5,6,9,${(estourou ? .5 : .7) * ab})`; bgg.fillRect(0, 0, W, H);
  const vg2 = bgg.createRadialGradient(540, 900, 300, 540, 900, 1250); vg2.addColorStop(0, 'rgba(0,0,0,0)'); vg2.addColorStop(1, `rgba(0,0,0,${.45 * ab})`); bgg.fillStyle = vg2; bgg.fillRect(0, 0, W, H);
  bgg.save(); bgg.globalAlpha = .03 * ab; bgg.fillStyle = bgg.createPattern(RUIDO, 'repeat'); bgg.fillRect(0, 0, W, H); bgg.restore();     // um fio de ruído quebra as faixas do degradê
  return bgc;
}
function compoe(q, g, so) {                                      // so = 'fundo' (fundo e cacos) ou 'cartao' (cartão, interface, borda e pessoa); sem so, os dois
  const [s, cx, cy] = card(q), x0 = cx - 540 * s, y0 = cy - 960 * s;
  const estourou = q >= QB;
  if (so !== 'cartao') {
    g.clearRect(0, 0, W, H);
    g.drawImage(fundo(q, estourou), 0, 0);                                    // o fundo: o próprio vídeo, grande, muito borrado e escuro (some a parede de ripas; o cartão se lê contra ele)
    // os cacos, atrás do cartão e da pessoa
    if (estourou) { renderer.render(scene, camera); g.save(); g.filter = 'blur(1.4px)'; g.drawImage(glc, 0, 0); g.restore(); }
    if (so === 'fundo') return;
  }
  const recorte = () => { g.beginPath(); g.moveTo(x0 - 4, y0 + H * s + 4); DENTE.forEach(([x, y]) => g.lineTo(x0 + x * s, y0 + y * s)); g.lineTo(x0 + W * s + 4, y0 + H * s + 4); g.closePath(); };
  // o cartão: sombra funda, o vídeo, o véu de baixo e a interface
  g.save(); trajeto(g, x0, y0, s, q);
  if (!estourou) { g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = 60 * Math.min(1, (1 - s) * 5); g.shadowOffsetY = 26 * Math.min(1, (1 - s) * 5); g.fillStyle = '#000'; g.fill(); g.shadowColor = 'transparent'; }
  g.clip();
  if (estourou) { recorte(); g.clip(); }
  g.drawImage(vcv, x0, y0, W * s, H * s);
  if (!estourou && q > 6.5 && q < QB) {                                       // f359: poucas linhas brancas finas e irregulares, no alto à direita
    const b = prog(q, 6.5, 7.1); g.strokeStyle = `rgba(255,255,255,${.95 * b})`; g.lineWidth = 1.3; g.lineJoin = 'round'; g.lineCap = 'round';
    RACHA.forEach(pts => { g.beginPath(); pts.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](x0 + p[0] * s, y0 + p[1] * s)); g.stroke(); }); }
  g.restore();
  // a interface de Reels (a de cima vai embora com os cacos) e a borda de vidro
  g.save(); trajeto(g, x0, y0, s, q); g.clip(); if (estourou) { recorte(); g.clip(); }
  interface_(g, q, (x0 - 236), (y0 - 180)); g.restore();
  if (!estourou) { g.save(); trajeto(g, x0, y0, s, q); g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 2; g.stroke(); g.restore(); }
  else {                                                                      // depois do estouro a borda de vidro clara segue a linha serrilhada e as laterais; 4 lascas ficam presas nas laterais
    g.save(); recorte(); g.clip(); trajeto(g, x0, y0, s, q); g.strokeStyle = 'rgba(255,255,255,.62)'; g.lineWidth = 3; g.stroke(); g.restore();
    g.save(); trajeto(g, x0, y0, s, q); g.clip(); g.beginPath(); DENTE.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x0 + x * s, y0 + y * s)); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2.6; g.lineJoin = 'round'; g.stroke(); g.restore();
    [[-1, 1030, 40, 70, 0], [-1, 1105, 30, 44, 1], [1, 1020, 36, 60, 0], [1, 1100, 28, 46, 1]].forEach(([lado, yl, w, h, inv]) => {  // [lado, y do quadro, largura, altura, inclinação]
      const xb = lado < 0 ? x0 : x0 + W * s, yb = yl - 179 + y0;
      g.beginPath(); g.moveTo(xb, yb); g.lineTo(xb + lado * w, yb + (inv ? h * .35 : 0)); g.lineTo(xb + lado * w * .25, yb + h); g.closePath();
      g.fillStyle = 'rgba(235,240,250,.5)'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.6; g.stroke(); }); }
  // a pessoa, inteira, por cima do escuro: só o que está acima da linha dos ombros (embaixo é o próprio cartão)
  if (estourou && matteOk) { g.save(); g.beginPath(); g.moveTo(x0 - 4, y0 - 4); g.lineTo(x0 + W * s + 4, y0 - 4); for (let i = DENTE.length - 1; i >= 0; i--) g.lineTo(x0 + DENTE[i][0] * s, y0 + (DENTE[i][1] + 5) * s); g.closePath(); g.clip();
    g.drawImage(pcv, x0, y0, W * s, H * s); g.restore(); }
}
function quadroQ(q, g) { compoe(q, g); }
function semPessoa() {                                           // o vídeo com o vulto da pessoa coberto pela cor média da parede ao redor (a textura dos cacos não leva rosto)
  wg.globalCompositeOperation = 'source-over'; wg.drawImage(vcv, 0, 0);
  if (!matteOk) return;
  vg_.clearRect(0, 0, W, H); vg_.globalCompositeOperation = 'source-over';
  for (let a = 0; a < 6.28; a += .52) vg_.drawImage(mcv, Math.cos(a) * 14, Math.sin(a) * 14);
  vg_.globalCompositeOperation = 'source-in'; vg_.fillStyle = 'rgb(30,31,38)'; vg_.fillRect(0, 0, W, H); vg_.globalCompositeOperation = 'source-over';
  wg.filter = 'blur(6px)'; wg.drawImage(vul, 0, 0); wg.filter = 'none';
}
function quadro(t) {
  const q = t * 30 + 1e-6; nQuadro++; atualizaFontes(); if (mimg.naturalWidth && !mvid) matteDaImagem(); semPessoa(); sg.clearRect(0, 0, W, H); sg.filter = 'blur(3px) grayscale(.65) brightness(' + CK.bt + ') contrast(' + CK.ct + ')'; sg.drawImage(wcv, 0, 0); sg.filter = 'none'; sg.fillStyle = 'rgba(205,212,225,.18)'; sg.fillRect(0, 0, W, H); if (matteOk) pessoa(); cardTex.needsUpdate = true;
  actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  const encolhe = q > .1 && q < 3.6, estoura = q > QB - .2 && q < QB + 9.5;
  if (!(encolhe || estoura) || KSUB < 2) { cacos(q); compoe(q, actx); return; }
  const tmp = quadro.tmp || (quadro.tmp = cv2(W, H)), tg = tmp.getContext('2d'), K = encolhe ? Math.min(KSUB, 14) : KSUB;
  const obt = encolhe ? (q < 4 ? .9 : .5) : (q < QB + 3 ? 1.1 : q < QB + 8 ? .6 : .4);          // o estouro: obturador longo (os riscos radiais da ref) e que não olha pra antes do estouro
  const q0 = estoura ? Math.max(QB, q - obt / 2) : q - obt / 2, q1 = q + obt / 2;
  actx.globalCompositeOperation = 'lighter'; actx.globalAlpha = 1 / K;
  const soFundo = estoura && !encolhe ? 'fundo' : undefined;       // no estouro o cartão e a pessoa não se mexem: vão por cima, uma vez só. Somados 24 vezes em 8 bits eles viravam degraus de 24 níveis (faixas rosa e marrom no laptop)
  for (let i = 0; i < K; i++) { const qq = q0 + (i / (K - 1)) * (q1 - q0); cacos(qq); compoe(qq, tg, soFundo); actx.drawImage(tmp, 0, 0); }
  actx.globalAlpha = 1; actx.globalCompositeOperation = 'source-over';
  if (soFundo) compoe(q, actx, 'cartao');
}

let tlRef = null;
Promise.all([mCarrega, avCarrega, document.fonts.load('700 23px system-ui, -apple-system, sans-serif'), document.fonts.load('500 21px system-ui, -apple-system, sans-serif')]).then(() => {
  D.monta(tl => {
    tlRef = tl;
    tl.to({}, {duration: dur}, 0);
    D.aoQuadro(() => quadro(tl.time()));
    // o vídeo termina de buscar depois do quadro: refaz o quadro com o que chegou (o seek do vídeo é assíncrono)
    [vid, mvid].forEach(v => v && v.addEventListener('seeked', () => quadro(tl.time())));
    renderer.compile(scene, camera); quadro(0);
    D.cue(0, 'whoosh'); D.cue(QB / 30, 'impact'); D.cue(QB / 30 + .03, 'shimmer');
    return dur;
  });
});
