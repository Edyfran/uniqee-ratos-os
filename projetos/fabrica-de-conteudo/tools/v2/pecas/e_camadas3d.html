     pessoa NO MEIO: a de trás, branca, passa atrás da cabeça (camada `tras`, entra no plano com "atras": true); a da frente, amarela e
     extrudada, na frente (camada `frente`). Letras soltas em planos de profundidade, com desfoque proporcional à distância do plano de foco
     e deriva de poucos px por quadro (parallax). Quando o foco passa da palavra de trás pra da frente, a de trás desfoca e escurece a 80%; em f543 a f546 um "e" e um "c" brancos cruzam a borda direita e saem; de f543 a f548 um reflexo branco nasce na 1ª letra da palavra da frente e varre a palavra pra direita.
     three.js de verdade (vendor/three): cada letra é um contorno da Inter Black (OFL, nucleo/fontes) EXTRUDADO, com chanfro, luz e sombra;
     a extrusão da amarela cai pra direita e pra baixo. O desfoque é por faixa de profundidade (uma passada do three por faixa, borrada) e o
     borrão de entrada é de verdade (média de subquadros). A cena é alfa. Desenhada só pelo tempo (seek): o mesmo quadro sai igual em qualquer render.
     1080x1920, --alpha. Duas camadas: o plano chama a peça duas vezes, `camada=tras` (com "atras": true, o recorte da pessoa fura) e `camada=frente`.
     t=0 é o quadro em que a palavra de trás entra (f531 da ref); a da frente entra em `tb` (f540). Corte seco no fim (`dur`).

function glifoShapes(ch) {
  const g = GLIFOS[ch]; if (!g || !g[1]) return [];
  const sp = new T.ShapePath(); let x = 0, y = 0;
  for (const m of g[1].match(/[MLHVQZ][^MLHVQZ]*/g)) {
    const c = m[0], n = (m.slice(1).match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
    if (c === 'M') { x = n[0]; y = n[1]; sp.moveTo(x, y); for (let i = 2; i < n.length; i += 2) { x = n[i]; y = n[i + 1]; sp.lineTo(x, y); } }
    else if (c === 'L') for (let i = 0; i < n.length; i += 2) { x = n[i]; y = n[i + 1]; sp.lineTo(x, y); }
    else if (c === 'H') n.forEach(v => { x = v; sp.lineTo(x, y); });
    else if (c === 'V') n.forEach(v => { y = v; sp.lineTo(x, y); });
    else if (c === 'Q') for (let i = 0; i < n.length; i += 4) { sp.quadraticCurveTo(n[i], n[i + 1], n[i + 2], n[i + 3]); x = n[i + 2]; y = n[i + 3]; }
  }
  return sp.toShapes(false);
}

function palavra(txt, size, xs, cor, corLado, prof, bev, ox, oy, track) {
  const sc = size / 1000, mf = new T.MeshStandardMaterial({color: cor, emissive: cor, emissiveIntensity: .38, roughness: .55, metalness: 0, transparent: true}), ms = new T.MeshStandardMaterial({color: corLado, emissive: corLado, emissiveIntensity: .22, roughness: .7, metalness: 0, transparent: true});
  const g = new T.Group(); let cur = 0;
  for (const ch of txt) {
    const gl = GLIFOS[ch]; if (!gl) continue;
    const sh = glifoShapes(ch);
    if (sh.length) { const geo = new T.ExtrudeGeometry(sh, {depth: prof / sc, bevelEnabled: true, bevelThickness: bev / sc, bevelSize: bev / sc * .8, bevelOffset: -bev / sc * .8, bevelSegments: 4, curveSegments: 8});
      const m = new T.Mesh(geo, [mf, ms]); m.position.x = cur; g.add(m); }
    cur += gl[0] + (track || 0);

  const zf = prof + bev;                                       // a frente da tampa; a extrusão se afasta dela pra (ox, oy)
  const inner = new T.Group(); inner.matrixAutoUpdate = false;
  const S = new T.Matrix4().makeScale(sc * xs, sc, sc);
  const SH = new T.Matrix4().set(1, 0, -ox / zf, ox, 0, 1, oy / zf, -oy, 0, 0, 1, 0, 0, 0, 0, 1);   // x += ox·(1 − z/zf), y −= oy·(1 − z/zf)
  inner.matrix.copy(SH).multiply(S);
  const box = new T.Box3().setFromObject(g).applyMatrix4(inner.matrix), cx = (box.min.x + box.max.x) / 2, cy = (box.min.y + box.max.y) / 2;
  inner.add(g);
  inner.matrix.premultiply(new T.Matrix4().makeTranslation(-cx, -cy, 0));       // o centro da caixa vira a origem (a matriz manda: inner.position não vale)
  const outer = new T.Group(); outer.add(inner); scene.add(outer);
  outer.userData = {w: box.max.x - box.min.x, h: box.max.y - box.min.y, mats: [mf, ms]};
  return outer;
}

function passada(q, ctx, w, tmp) {
  const [cxq, cyq] = camQ(q); camera.position.set(cxq, cyq, DCAM);
  const t = tmp.getContext('2d'); t.globalCompositeOperation = 'source-over'; t.globalAlpha = 1; t.clearRect(0, 0, W, H); t.filter = 'none';
  const faixas = new Map();
  els.forEach((e, i) => { e.group.visible = false; if (CAM !== 'todas' && e.cam !== CAM) return; const s = e.st(q); if (!s.vis) return;
    const r = quant(s.blur); if (!faixas.has(r)) faixas.set(r, []); faixas.get(r).push([e, s]); });
  const ordem = [...faixas.entries()].sort((a, b) => a[1].reduce((m, [e]) => m + e.z, 0) / a[1].length - b[1].reduce((m, [e]) => m + e.z, 0) / b[1].length);
  for (const [r, lista] of ordem) {
    els.forEach(e => e.group.visible = false);
    lista.forEach(([e, s]) => aplica(e, s));
    renderer.render(scene, camera);
    t.filter = r > 0 ? `blur(${r}px)` : 'none'; t.drawImage(glc, 0, 0); t.filter = 'none';
  }
  if (w === 1 && CAM !== 'tras') reflexo(q, t);
  ctx.globalAlpha = w; ctx.drawImage(tmp, 0, 0);
}
// o reflexo branco que varre a palavra da frente em f543 a f548 (q 12 a 17): nasce no canto de cima da 1ª letra, cresce sobre ela até f545 e varre a palavra pra direita em 3 quadros (f546 a f548).
// [q, x da borda da frente (px da ref), largura do núcleo, cauda atrás dele (px), opacidade]; só aparece dentro da palavra, em linha inclinada
const REFL = [[11.7, 312, 0, 0, 0], [12, 312, 5, 0, 1], [13, 302, 32, 0, 1], [14, 282, 82, 0, 1], [14.7, 330, 60, 60, 1], [15, 482, 38, 282, 1], [16, 814, 50, 600, 1], [17, 958, 34, 746, 1], [17.8, 1010, 20, 760, 0]];
const gmask = document.createElement('canvas'), gbanda = document.createElement('canvas'); [gmask, gbanda].forEach(c => { c.width = W; c.height = H; });
function reflexo(q, t) {
  if (q < 11.7 || q > 17.8) return;
  const b = els.find(e => e.id === 'b'), sb = b.st(q); if (!sb.vis) return;
  let i = 1; while (i < REFL.length - 1 && REFL[i][0] < q) i++;
  const A = REFL[i - 1], B = REFL[i], u = clamp((q - A[0]) / (B[0] - A[0]), 0, 1), v = [1, 2, 3, 4].map(j => lerp(A[j], B[j], u));
  els.forEach(e => e.group.visible = false); aplica(b, sb); renderer.render(scene, camera);          // a máscara: só a palavra da frente, sem desfoque
  const gm = gmask.getContext('2d'); gm.setTransform(1, 0, 0, 1, 0, 0); gm.globalCompositeOperation = 'source-over'; gm.clearRect(0, 0, W, H); gm.drawImage(glc, 0, 0);
  const ga = gbanda.getContext('2d'), F = v[0] + DX, core = v[1], tail = v[2], yc = sb.y + DY;
  ga.setTransform(1, 0, 0, 1, 0, 0); ga.globalCompositeOperation = 'source-over'; ga.clearRect(0, 0, W, H);
  ga.save(); ga.translate(0, yc); ga.transform(1, 0, -.3, 1, 0, 0);
  if (tail > 0) { const g = ga.createLinearGradient(F - core - tail, 0, F - core, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.55)'); ga.fillStyle = g; ga.fillRect(F - core - tail, -260, tail, 520); }
  ga.fillStyle = '#fff'; ga.fillRect(F - core, -260, core, 520); ga.restore();
  ga.globalCompositeOperation = 'destination-in'; ga.drawImage(gmask, 0, 0); ga.globalCompositeOperation = 'source-over';
  t.globalAlpha = v[3]; t.drawImage(gbanda, 0, 0); t.globalAlpha = 1;
}
const tmpc = document.createElement('canvas'); tmpc.width = W; tmpc.height = H;
function quadro(t) {
  const q = t * 30 + 1e-6;
  actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  const entrada = q > TB - 1 && q < TB + 1.2, borrado = (q < 2.4) || entrada || (q > TB + 10.6 && q < TB + 14);
  if (!borrado || KSUB < 2) { SUB.k = 0; SUB.K = 1; passada(q, actx, 1, tmpc); return; }
  actx.globalCompositeOperation = 'lighter';
  const obt = q < 2.4 ? .8 : entrada ? .6 : .6, K = entrada ? KSUB * 2 + 4 : KSUB;   // a varredura horizontal pede mais subquadros
  const q0 = q < 2.4 ? Math.max(0, q - obt / 2) : q - obt / 2, q1 = q + obt / 2;       // na entrada da palavra de trás o obturador não olha pra antes dela (f531 saía com metade do brilho)
  for (let k = 0; k < K; k++) { SUB.k = k; SUB.K = K; passada(q0 + (k / (K - 1)) * (q1 - q0), actx, 1 / K, tmpc); }
  SUB.k = 0; SUB.K = 1;
  actx.globalAlpha = 1; actx.globalCompositeOperation = 'source-over';
}

D.monta(tl => {
  tl.to({}, {duration: dur}, 0);
  D.aoQuadro(() => quadro(tl.time()));
  renderer.compile(scene, camera); quadro(0);
  D.cue(.07, 'impact'); D.cue(Math.max(0, (TB - 1) / 30), 'whoosh'); D.cue((TB + 3) / 30, 'hit');
  return dur;
});
