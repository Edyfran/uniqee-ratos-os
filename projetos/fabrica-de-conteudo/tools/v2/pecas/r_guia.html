<!DOCTYPE html>
<!-- PROVA — a janela do guia em vidro, com os pedidos prontos pra copiar. 1080x1920, --alpha, tema neon.
     A mecânica do anúncio de edição do concorrente (videos/fabrica/avatar-camadas/REF.md, 32,5–36 s): a janela
     do documento sobe atrás da cabeça (quem põe atrás é o compositor, com a pessoa recortada por cima), os
     blocos de pedido acendem um por vez e o botão "Copiar" vira "Copiado ✓".
       arq   o nome na barra · h  o título do documento
       bl    "seção|pedido@t;…" os blocos (o t é quando acende) · t_copia  o clique no Copiar do último bloco
       y     o topo da janela (280) · dur · sai=0
     ?arq=GUIA-DE-PEDIDOS.md&h=Guia de pedidos&bl=Reel do celular|corta o vídeo que eu gravei no celular e põe legenda@0.6;Legenda|põe legenda com a palavra PREÇO em destaque@1.2;Ícones animados|põe um ícone animado em cada ideia do roteiro@1.8&t_copia=2.4&dur=3.2&tema=neon -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block;position:relative}
#jan{position:absolute;left:110px;width:860px;border-radius:var(--raio);opacity:0;padding:0 0 30px;
  background:var(--painel);border:2px solid var(--painel-borda);box-shadow:var(--painel-brilho),0 30px 80px rgba(0,0,0,.55)}
#barra{height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:2px solid rgba(210,198,255,.14);font:700 26px/1 var(--fm);color:var(--ink6)}
#barra i{width:16px;height:16px;border-radius:50%;background:#FF6B8A}#barra i+i{background:#FFC857}#barra i+i+i{background:#4ADE80}
#barra .arq{margin-left:14px}
.h{padding:30px 34px 6px;font:900 62px/1 var(--fd);letter-spacing:-.04em;color:#fff}
.bl{margin:20px 34px 0;opacity:.45}
.bl .s{font:800 30px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ac2)}
.bl .c{position:relative;margin-top:12px;padding:20px 150px 20px 22px;border-radius:var(--raio-s);background:rgba(8,5,20,.62);border:2px solid rgba(210,198,255,.18);
  font:700 34px/1.25 var(--fm);color:#EDE9FF}
.bl .cp{position:absolute;right:14px;top:14px;padding:12px 16px;border-radius:12px;font:800 22px/1 var(--fm);letter-spacing:.06em;color:#fff;
  background:rgba(124,92,255,.35);border:2px solid var(--painel-borda)}
.bl .cp.ok{background:rgba(74,222,128,.25);border-color:rgba(74,222,128,.75)}
</style>
</head>
<body>
<div id="stage"><div id="jan"><div id="barra"><i></i><i></i><i></i><span class="arq"></span></div><div class="h"></div></div></div>
<script>
const dur = D.n('dur', '3.2');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const jan = document.getElementById('jan');
jan.style.top = D.n('y', '280') + 'px';
jan.querySelector('.arq').textContent = D.q('arq', 'GUIA-DE-PEDIDOS.md');
jan.querySelector('.h').textContent = D.q('h', 'Guia de pedidos');
const bl = D.itens('bl', 'Reel do celular|corta o vídeo que eu gravei no celular e põe legenda@0.6;Legenda|põe legenda com a palavra PREÇO em destaque@1.2;Ícones animados|põe um ícone animado em cada ideia do roteiro@1.8', ['s', 'c']);
bl.forEach((b, i) => jan.insertAdjacentHTML('beforeend',
  `<div class="bl" id="bl${i}"><div class="s">${esc(b.s)}</div><div class="c">${esc(b.c)}<span class="cp">Copiar</span></div></div>`));

D.monta(tl => {
  // a janela sobe de baixo, de dentro do desfoque
  tl.fromTo(jan, {opacity: 0, y: 160, scale: .94, filter: 'blur(14px)'}, {opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: .5, ease: 'expo.out'}, 0);
  D.cue(0, 'whoosh');
  bl.forEach((b, i) => {
    const el = document.getElementById('bl' + i), c = el.querySelector('.c');
    tl.to(el, {opacity: 1, duration: .2}, D.at(b.t));
    tl.fromTo(c, {borderColor: 'rgba(210,198,255,.18)', boxShadow: '0 0 0 rgba(0,0,0,0)'},
      {borderColor: 'rgba(196,181,253,.85)', boxShadow: '0 0 34px rgba(124,92,255,.5)', duration: .25, immediateRender: false}, D.at(b.t));
    if (i < bl.length - 1) tl.to(c, {borderColor: 'rgba(210,198,255,.3)', boxShadow: '0 0 0 rgba(0,0,0,0)', duration: .25}, D.at(bl[i + 1].t));
    D.cue(b.t, 'click');
  });
  const tc = D.n('t_copia', '2.4');
  const cp = document.querySelector('#bl' + (bl.length - 1) + ' .cp');
  tl.set(cp, {className: 'cp ok', textContent: 'Copiado ✓'}, tc);
  tl.fromTo(cp, {scale: 1.3}, {scale: 1, duration: .3, ease: 'expo.out', immediateRender: false}, tc);
  D.cue(tc, 'certo');
  if (D.q('sai', '1') !== '0') {
    tl.to(jan, {opacity: 0, y: -40, filter: 'blur(10px)', duration: .26, ease: D.P.SAI}, dur - .28);
    D.cue(dur - .28, 'whoosh-out');
  }
  return dur;
});
</script>
</body>
</html>
