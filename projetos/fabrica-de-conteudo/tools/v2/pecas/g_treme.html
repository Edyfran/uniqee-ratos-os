<!DOCTYPE html>
<!-- GANCHO — treme e apaga: um cartão com 4 ícones nossos (tesoura, linha do tempo, legenda, play: nenhuma marca de
     terceiro) no "modo de edição" do celular: os ícones tremem de lado a lado, cada um com o selo "−" no canto, e somem
     um por um, encolhendo até zero. É o "tudo isso que você apertava à mão" do tutorial de edição. 1080x1920, --alpha.
     ~1,1 s de ação (entra, treme, apaga) e o cartão sai.
       ic   os ícones, separados por | (tesoura · timeline · legenda · play · imagem · brilho; outro nome vira texto)
       lb   os rótulos, na mesma ordem · kick  a etiqueta do cartão (modo de edição, vazia = sem)
       y    o topo do cartão em px (1130) · w  a largura (900) · t0 · sai  quando sai (1.55) · dur
       ?ic=tesoura|timeline|legenda|play&lb=cortar|timeline|legenda|exportar&kick=modo de edição&y=1130&t0=0.1&dur=2.0 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.cd{position:absolute;left:90px;padding:34px 36px 30px;display:flex;flex-direction:column;gap:22px}
.cd .kick{margin:0;opacity:1}
.fl{display:flex;justify-content:space-around;align-items:flex-start}
.it{display:flex;flex-direction:column;align-items:center;gap:20px;width:180px}
.pl{position:relative;width:150px;height:150px}
.fc{position:absolute;inset:0;border-radius:22%;border:5px solid var(--ink);background:var(--fc);box-shadow:6px 6px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.fc svg{width:60%;height:60%;overflow:visible;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc .tx{font:800 48px/1 var(--fd);color:var(--fg)}
.sl{position:absolute;left:-16px;top:-16px;width:46px;height:46px;border-radius:50%;background:var(--no);border:4px solid var(--ink);
  color:#fff;font:800 38px/1 var(--fd);display:flex;align-items:center;justify-content:center;padding-bottom:5px}
.lb{font:700 27px/1 var(--fm);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><div class="cd nb" id="cd"><div class="kick" id="k"></div><div class="fl" id="fl"></div></div></div>
<script>
const ICONES = {
  tesoura: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88"/><path d="M14.47 14.48L20 20"/><path d="M8.12 8.12L12 12"/>',
  timeline: '<rect x="3" y="5" width="9" height="3.4" rx="1"/><rect x="9" y="10.3" width="12" height="3.4" rx="1"/><rect x="5" y="15.6" width="8" height="3.4" rx="1"/>',
  legenda: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 11h10M7 15h4M14 15h3"/>',
  play: '<path d="M7 4.5l12 7.5-12 7.5z"/>',
  imagem: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/>',
  brilho: '<path d="M11 2.5c.6 5.2 2.4 7 7.5 7.5-5.1.6-6.9 2.4-7.5 7.5-.6-5.1-2.4-6.9-7.5-7.5 5.1-.5 6.9-2.3 7.5-7.5z"/>',
};
const FACES = [['var(--ac)', '#fff'], ['var(--mk)', 'var(--ink)'], ['#fff', 'var(--ink)'], ['var(--ac)', '#fff']];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const $ = id => document.getElementById(id);
const dur = D.n('dur', '2'), t0 = D.n('t0', '0.1'), sai = D.n('sai', '1.55');
const ics = D.q('ic', 'tesoura|timeline|legenda|play').split('|').filter(Boolean).slice(0, 4);
const lbs = D.q('lb', 'cortar|timeline|legenda|exportar').split('|');
$('k').textContent = D.q('kick', 'modo de edição');
$('cd').style.top = D.n('y', '1130') + 'px'; $('cd').style.width = D.n('w', '900') + 'px';
$('fl').innerHTML = ics.map((n, i) => {
  const [fc, fg] = FACES[i % 4];
  const dentro = ICONES[n] ? `<svg viewBox="0 0 24 24">${ICONES[n]}</svg>` : `<div class="tx">${esc(n)}</div>`;
  return `<div class="it"><div class="pl"><div class="fc" style="--fc:${fc};--fg:${fg}">${dentro}</div><div class="sl">−</div></div><div class="lb">${esc(lbs[i] || '')}</div></div>`;
}).join('');

D.monta(tl => {
  const its = [...document.querySelectorAll('.it')], pls = [...document.querySelectorAll('.pl')], sls = [...document.querySelectorAll('.sl')];
  D.pousa('#cd', t0, {dy: 90, dr: 0});
  const tj = D.at(t0) + .3, apaga = its.map((_, i) => tj + .28 + i * .17);
  // o tremor: cada ícone com a sua fase e o seu lado, como no modo de edição do iPhone
  pls.forEach((p, i) => {
    const fim = apaga[i], per = .075 + (i % 2) * .008, ang = (i % 2 ? 2.6 : -2.6);
    const n = Math.max(1, Math.floor((fim - tj - i * .02) / per));
    tl.fromTo(p, {rotation: -ang}, {rotation: ang, duration: per, ease: 'sine.inOut', yoyo: true, repeat: n}, tj + i * .02);
    tl.to(p, {y: -2, duration: per * 1.3, ease: 'sine.inOut', yoyo: true, repeat: Math.floor(n / 1.3)}, tj + i * .02);
  });
  // os selos "−" pulam no instante em que o tremor começa
  tl.fromTo(sls, {scale: 0}, {scale: 1, duration: .22, ease: 'back.out(2.4)', stagger: .04}, tj - .02);
  D.cue(tj, 'pop');
  // e os ícones somem um por um, encolhendo até zero (o selo vai junto)
  its.forEach((it, i) => {
    tl.to(it, {scale: 0, opacity: 0, duration: .22, ease: 'back.in(2)', transformOrigin: '50% 50%'}, apaga[i]);
    D.cue(apaga[i] + .1, 'pop');
  });
  D.sai('#cd', sai);
  return dur;
});
</script>
</body>
</html>
