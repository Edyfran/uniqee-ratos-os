<!DOCTYPE html>
<!-- EFEITO — o painel chapado da tela dividida: um bloco de cor lisa que cai do alto e ocupa os 40% de cima, com borda de tinta e a sombra
     dura embaixo; o vídeo (a câmera, passo `janela`) desce atrás da borda dele. Sem texto: o assunto do painel é o que vier por cima
     (o selo, uma peça). 1080x1920, --alpha. Clone do "fundo chapado" do De25fKeTRl7, por cima da pessoa e não atrás dela.
       etiqueta: tela-dividida, chao-chapado
       h  a altura do painel (768) · cor  ac (azul) | mk (amarelo) | ink (tinta) | br (papel) (ac)
       entra  quanto leva pra cair (0.25) · sai  quanto leva pra subir (0.2) · dur
       ?h=768&cor=ac&entra=0.25&sai=0.2&dur=1.3 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
#pn{position:absolute;left:0;top:0;width:1080px;background:var(--ac);border-bottom:8px solid var(--ink);box-shadow:0 14px 0 var(--mk)}
</style>
</head>
<body>
<div id="stage"><div id="pn" data-qa="fundo"></div></div>
<script>
const h = D.n('h', '768'), entra = D.n('entra', '0.25'), sai = D.n('sai', '0.2'), dur = D.n('dur', '1.3');
const cor = D.q('cor', 'ac');
function $(s) { return document.querySelector(s); }
$('#pn').style.height = (h - 8) + 'px';
$('#pn').style.background = 'var(--' + cor + ')';
D.monta(tl => {
  // cai do alto até a borda assentar em y = h; sobe de volta nos últimos `sai` segundos
  tl.fromTo('#pn', {y: -(h + 30)}, {y: 0, duration: entra, ease: 'power3.out'}, 0);
  tl.to('#pn', {y: -(h + 30), duration: sai, ease: 'power2.in'}, Math.max(entra, dur - sai));
  return dur;
});
</script>
</body>
</html>
