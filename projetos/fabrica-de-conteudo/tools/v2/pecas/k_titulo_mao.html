<!DOCTYPE html>
<!-- TIPOGRAFIA — o título de mão do gancho: duas linhas em caixa alta, a de cima fina e branca, a de baixo em
     marcador amarelo com o sublinhado de pincel. Inclinadas ~3°, na faixa de cima (acima do boné). Já inteiro no
     primeiro quadro, sem entrada; sai num corte seco. 1080x1920, --alpha. Clone do efeito 01 do Deps_-cz-Fg.
       l1   a linha de cima (cabe em 960 px) · l2  a linha em amarelo, com o sublinhado
       y    o topo da tinta da linha 1 (238) · rot  a inclinação em graus (-3)
       t0 · sai  quando sai (-1: fica até o fim) · dur
       ?l1=O CLAUDE É PÉSSIMO EDITANDO VÍDEO&l2=A MENOS QUE...&y=238&sai=2.75&dur=2.75 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Kalam:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/editorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px;background:transparent}
#stage{padding:0;display:block;background:none}
#t{position:absolute;left:0;top:0;width:1080px;transform-origin:50% 0}
.l{position:absolute;left:0;white-space:nowrap;text-transform:uppercase;transform-origin:0 0}
#a{font:700 60px/1 'Kalam',cursive;color:#fff;-webkit-text-stroke:3px rgba(20,24,28,.8);paint-order:stroke fill;
  letter-spacing:.03em;filter:drop-shadow(3px 5px 5px rgba(0,0,0,.4))}
#b{font:400 100px/1 'Permanent Marker',cursive;color:var(--mk);-webkit-text-stroke:3px rgba(20,24,28,.8);paint-order:stroke fill;
  filter:drop-shadow(3px 5px 5px rgba(0,0,0,.4))}
#s{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(3px 5px 5px rgba(0,0,0,.4))}
</style>
</head>
<body>
<div id="stage"><div id="t"><div class="l" id="a"></div><div class="l" id="b"></div>
<svg id="s" width="10" height="10"><path id="p" d="" fill="none" stroke="var(--mk)" stroke-width="7" stroke-linecap="round"/></svg></div></div>
<script>
const dur = D.n('dur', '2.75'), t0 = D.n('t0', '0'), sai = D.n('sai', '-1');
const a = document.getElementById('a'), b = document.getElementById('b');
a.textContent = D.q('l1', 'O CLAUDE É PÉSSIMO EDITANDO VÍDEO');
b.textContent = D.q('l2', 'A MENOS QUE...');
D.monta(tl => {
  const t = document.getElementById('t'), y = D.n('y', '238');
  // a linha 1 estica até 960 px; a 2 fica em ~590 px de largura, centrada
  const fit = (el, w) => { el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * Math.min(2.2, w / el.getBoundingClientRect().width)) + 'px'; };
  fit(a, 940); fit(b, 800);
  const wa = a.getBoundingClientRect().width, wb = b.getBoundingClientRect().width;
  const ha = a.getBoundingClientRect().height, hb = b.getBoundingClientRect().height;
  a.style.left = (540 - wa / 2) + 'px'; a.style.top = '0px';
  b.style.left = (540 - wb / 2) + 'px'; b.style.top = (ha + 4) + 'px';
  // sublinhado de pincel: ondula, passa um pouco das bordas da palavra
  const sx = 540 - wb / 2 - 30, ex = 540 + wb / 2 + 40, sy = ha + 4 + hb * .98;
  const dx = (ex - sx) / 4;
  document.getElementById('p').setAttribute('d', 'M' + sx + ',' + (sy + 4) + ' C' + (sx + dx) + ',' + (sy - 8) + ' ' + (sx + 2 * dx) + ',' + (sy + 10) + ' ' + (sx + 3 * dx) + ',' + (sy + 2) + ' S' + ex + ',' + (sy - 4) + ' ' + ex + ',' + (sy - 4));
  const sv = document.getElementById('s'); sv.setAttribute('width', 1080); sv.setAttribute('height', 400);
  t.style.top = y + 'px'; t.style.transform = 'rotate(' + D.n('rot', '-3') + 'deg)';
  tl.fromTo(t, {opacity: 0}, {opacity: 1, duration: 1 / 30, ease: 'none'}, t0);
  if (sai >= 0) tl.to(t, {opacity: 0, duration: 1 / 30, ease: 'none'}, sai);
  return dur;
});
</script>
</body>
</html>
