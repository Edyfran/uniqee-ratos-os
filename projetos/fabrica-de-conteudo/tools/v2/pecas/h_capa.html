<!DOCTYPE html>
<!-- AULA — a capa de um curso (ou de qualquer imagem 16:9) no cartão do canto. 1920x1080, --alpha.
     Mesma posição e entrada do h_termo: o cartão pousa pela direita, a capa aparece dentro dele.
     Se a capa não traz o nome, ?nome= põe o nome embaixo.
       ?img=/caminho/capa.png&kick=bônus 1&nome=Ninja Skills&t0=0.2&dur=5
     ?tags=Nome@0.4;Outro@1.6 põe uma etiqueta por item embaixo da capa, cada uma entrando no seu tempo (uma capa, vários itens).
     ?k= encolhe a partir do canto de cima à direita e ?dir= é a distância da borda (px), como no h_termo. -->
<html lang="pt-BR" class="h alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
#esc{position:absolute;inset:0;transform:scale(var(--k,1));transform-origin:calc(100% - var(--dir,120px)) 110px}
.cd{position:absolute;right:var(--dir,120px);top:110px;width:660px;padding:30px 36px 34px;opacity:0}
.cd .kick{font-size:20px;margin-bottom:22px}
#cap{width:588px;height:331px;border:var(--bw) solid var(--ink);border-radius:12px;overflow:hidden;background:var(--cod);opacity:0}
#cap .mid{width:100%;height:100%}
.nm{margin-top:20px;font:700 56px/1.04 var(--fd);letter-spacing:var(--ls);color:var(--ink);opacity:0}
.nm:empty{display:none}
#tg{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
#tg:empty{display:none}
#tg .mkr{font:700 40px/1.1 var(--fd);letter-spacing:var(--ls);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="esc"><div class="cd nb" id="cd"><div class="kick" id="k"></div><div id="cap"></div><div class="nm" id="nm"></div><div id="tg"></div></div></div>
</div>
<script>
const dur = D.n('dur', '5'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
$('k').textContent = D.q('kick', 'bônus');
document.documentElement.style.setProperty('--dir', D.n('dir', 120) + 'px');
D.midia('#cap', D.q('img', ''), 'capa', 'cover');
if (D.q('nome', '')) $('nm').innerHTML = '<b class="mkr">' + D.q('nome', '') + '</b>';
const tags = D.q('tags', '') ? D.itens('tags', '', ['nm']) : [];
tags.forEach((g, i) => $('tg').insertAdjacentHTML('beforeend', `<b class="mkr" id="tg${i}">${g.nm}</b>`));

D.monta(tl => {
  D.pousa('#cd', t0, {dx: 70, dy: 0, som: 'pop'});
  D.carimbo('#k', t0 + .12, 0);
  D.entra('#cap', t0 + .3, 12);
  D.entra('#nm', t0 + .6, 12);
  tags.forEach((g, i) => D.entra('#tg' + i, isNaN(g.t) ? t0 + .8 + i * .5 : g.t, 12));
  D.sai('#cd', dur - .45);
  return dur;
});
</script>
</body>
</html>
