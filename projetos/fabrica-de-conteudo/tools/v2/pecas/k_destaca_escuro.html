<!DOCTYPE html>
<!-- TIPOGRAFIA — a palavra que corta a cena: a cena escurece de uma vez (sem rampa) e a palavra gigante em amarelo
     já está no lugar, na faixa de cima, parada. Entra seca e sai borrada num quadro, no corte. 1080x1920, --alpha: o
     escurecimento é uma camada preta por cima do take (a pessoa do plano fica escura junto, como no original).
     Clone do efeito 06 do Deps_-cz-Fg.
       l      a palavra (caixa baixa, uma linha) · y  o topo da tinta (278) · h  a altura da tinta (142)
       larg   a largura máxima (806) · esc  o quanto escurece, 0-1 (.66)
       t0 (0) · sai  quando sai (-1: fica até o fim) · dur
       ?l=se destaca&y=278&h=142&esc=.66&t0=0&dur=1.2 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/editorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px;background:transparent}
#stage{padding:0;display:block;background:none}
#e{position:absolute;inset:0;background:#000;opacity:0}
#w{position:absolute;left:0;top:0;white-space:nowrap;font:900 100px/1 var(--ed-sans);letter-spacing:-.03em;color:var(--mk);
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transform-origin:50% 50%;opacity:0}
</style>
</head>
<body>
<div id="stage"><div id="e"></div><div id="w"></div></div>
<script>
const dur = D.n('dur', '1.1'), t0 = D.n('t0', '0'), sai = D.n('sai', '-1');
const w = document.getElementById('w'); w.textContent = D.q('l', 'se destaca');
D.monta(tl => {
  // a tinta medida no canvas: o corpo sai da altura pedida, depois encolhe até caber na largura
  const cx = document.createElement('canvas').getContext('2d');
  cx.font = '900 100px ' + D.css('--ed-sans').split(',')[0];
  const m = cx.measureText(w.textContent);
  const alt = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  let k = D.n('h', '142') / alt;
  const larg = D.n('larg', '806'), tw = m.width * k;
  if (tw > larg) k *= larg / tw;
  w.style.fontSize = (100 * k) + 'px';
  const wr = w.getBoundingClientRect();
  const topoTinta = (wr.height / 2 + (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) * k / 2) - m.actualBoundingBoxAscent * k;
  w.style.left = (540 - wr.width / 2) + 'px'; w.style.top = (D.n('y', '278') - topoTinta) + 'px';
  tl.set('#e', {opacity: D.n('esc', '.66')}, t0);
  // entra seca, de uma vez (corte), e sai borrada num quadro-e-meio antes do corte, como medido na ref
  tl.set('#w', {opacity: 1}, t0);
  if (sai >= 0) {
    tl.fromTo('#w', {filter: 'blur(0px) drop-shadow(0 4px 8px rgba(0,0,0,.35))'},
      {filter: 'blur(14px) drop-shadow(0 4px 8px rgba(0,0,0,.35))', duration: 1 / 15, ease: 'none', immediateRender: false}, sai - 1 / 15);
    tl.set('#w', {opacity: 0}, sai); tl.set('#e', {opacity: 0}, sai);
  }
  return dur;
});
</script>
</body>
</html>
