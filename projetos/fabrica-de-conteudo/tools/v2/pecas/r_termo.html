<!DOCTYPE html>
<!-- PROVA — termo + definição (glossário). 1080x1920, ou ?ar=1920x1080 pra aula.
     Na aula (16:9) ela mora em left:90, 32 px acima da faixa do player (bottom:216), perto da tarja do
     lesson_overlays.py. O termo cai como etiqueta amarela, a definição abre
     embaixo e sobe por palavra. Uma linha só: se não couber no piso, é card
     de tela cheia, não tarja (regra do glossário). ?cor=ok|no|ac|ink troca a etiqueta do
     termo (padrão: marcador amarelo); verde e vermelho são sinal, não decoração.
     ?ic=url põe um ícone no fim da definição, na altura da letra (a raridade da carta
     no lugar da palavra "rara"). ?sub=texto abre uma segunda linha, menor, embaixo da
     definição (o subtítulo da carta: "Aladdin & Genie" / "Mischievous Pals").
     x=, larg=, tam= (opcionais, o padrão não muda): `x` é a borda esquerda em px (56), `larg` a largura da
     peça em px (954) e `tam` a escala da letra do termo e da definição juntas (1; 0.76 = 35 px na definição).
     Com `larg`, o nome que não cabe numa linha quebra em duas, no espaço mais perto do meio (nunca corta).
       ?termo=deploy&def=publicar: tirar do seu computador e pôr na internet&t=0.1&dur=2.5 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.tj{position:absolute;left:var(--x,56px);width:var(--w,954px);top:var(--y,1300px);display:flex;flex-direction:column;align-items:flex-start}
.termo{position:relative;z-index:2;padding:calc(14px*var(--tm,1)) calc(24px*var(--tm,1)) calc(16px*var(--tm,1));margin:0 0 -6px calc(18px*var(--tm,1));font:700 calc(60px*var(--tm,1))/1 var(--fd);letter-spacing:var(--ls);white-space:nowrap;opacity:0}
.def .ic-r{height:1.35em;width:auto;vertical-align:-.32em;margin-left:.32em}
.def .sb{display:block;font-size:.72em;font-weight:500;color:var(--ink6);margin-top:.12em}
.def{padding:calc(26px*var(--tm,1)) calc(28px*var(--tm,1)) calc(22px*var(--tm,1));font:600 calc(46px*var(--tm,1))/1.15 var(--fd);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;opacity:0}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html.h .tj{left:90px;top:auto;bottom:calc(var(--yt-pe) + 32px);width:1100px}
html.h .termo{font-size:44px;padding:10px 18px 12px}
html.h .def{font-size:34px;padding:20px 22px 18px}
</style>
</head>
<body>
<div id="stage"><div class="tj" id="tj"><div class="termo nb cor-mk" id="tm"></div><div class="def nb" id="df"><span id="dt"></span></div></div></div>
<script>
if ((D.q('ar', '')).startsWith('1920x1080')) document.documentElement.classList.add('h');
const dur = D.n('dur', '2.5'), t0 = D.n('t', '0.1');
if (D.q('y')) document.documentElement.style.setProperty('--y', D.q('y') + 'px');
if (D.q('x')) document.documentElement.style.setProperty('--x', D.q('x') + 'px');
if (D.q('larg')) document.documentElement.style.setProperty('--w', D.q('larg') + 'px');
if (D.q('tam')) document.documentElement.style.setProperty('--tm', D.q('tam'));
document.getElementById('tm').textContent = D.q('termo', 'deploy');
// ?cor=ok|no|ac|ink — o termo pode ser sinal (verde = valor, vermelho = custo); padrão é o marcador
const cor = D.q('cor', 'mk');
if (['ok', 'no', 'ac', 'ink', 'mk'].includes(cor)) document.getElementById('tm').className = 'termo nb cor-' + cor;
document.getElementById('dt').textContent = D.q('def', 'publicar: tirar do seu computador e pôr na internet');
if (D.q('def', null) === '') document.getElementById('df').style.display = 'none';   // ?def= vazio: só o termo (dono, 19/10)
if (D.q('ic')) { const i = new Image(); i.className = 'ic-r'; i.src = D.q('ic'); document.getElementById('df').appendChild(i); }
if (D.q('sub')) document.getElementById('df').insertAdjacentHTML('beforeend', '<span class="sb" id="sb"></span>');
if (D.q('sub')) document.getElementById('sb').textContent = D.q('sub');

D.monta(tl => {
  if (D.q('larg')) {   // nome comprido: duas linhas, quebra no espaço mais perto do meio
    const dt = document.getElementById('dt'), tx = dt.textContent, tj = document.getElementById('tj'), df = document.getElementById('df');
    df.style.whiteSpace = 'nowrap'; df.style.width = 'max-content';
    const largo = df.getBoundingClientRect().width > tj.clientWidth + 0.5; df.style.width = '';
    const esp = [...tx].map((c, i) => c === ' ' ? i : -1).filter(i => i >= 0);
    if (largo && esp.length) {
      const m = esp.reduce((a, b) => Math.abs(b - tx.length / 2) < Math.abs(a - tx.length / 2) ? b : a);
      dt.textContent = ''; dt.append(tx.slice(0, m), document.createElement('br'), tx.slice(m + 1));
    }
  }
  D.cabe('.def', document.documentElement.classList.contains('h') ? 24 : 30, '.tj');
  D.pousa('#df', t0 + .1, {dy: -20, dr: 0, rot: 0});
  D.carimbo('#tm', t0, D.P.ROT - 1.5);
  const ws = D.palavras('#dt', t0 + .2, .035);
  // o ícone chega depois da última palavra, como o carimbo do termo
  if (D.q('sub')) D.palavras('#sb', t0 + .3 + ws.length * .035, .035);
  if (D.q('ic')) D.tl.fromTo('.ic-r', {scale: 0, rotation: -25}, {scale: 1, rotation: 0,
    duration: .35, ease: 'back.out(2.6)'}, t0 + .25 + ws.length * .035);
  D.sai(['#tm', '#df'], dur - .4);
  return dur;
});
</script>
</body>
</html>
