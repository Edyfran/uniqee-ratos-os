<!DOCTYPE html>
<!-- CLONE — parede de vídeos ATRÁS da pessoa (Deps_-cz-Fg, efeito 03). 1080x1920, --alpha. Pede `atras`.
     Entra em 2 tempos: blocos estalam espalhados (0,13 s) com a grade GRANDE (1,6), depois ela encolhe a 1,0 (0,2 s, ease-out)
     e mais blocos entram pelas bordas. Cada bloco é vídeo: sprite de 10 quadros a 15 qps de Reels nossos (muro-quadros/).
     As colunas rolam o tempo todo, alternadas: 1ª e 3ª sobem, 2ª e 4ª descem, a 120 px/s (medido na ref a 30 qps:
     4 px por quadro, constante). Saída seca (fade_saida 0). 4 colunas masonry, vão 7 px, canto reto.
       alt  altura da parede (1000) · t0 (0.05) · dur (0.67) · vel  rolagem em px/s (120)
       ?alt=1000&t0=0.05&dur=0.67&vel=120 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px;background:transparent}
#stage{padding:0;display:block;overflow:hidden;background:none}
#w{position:absolute;left:0;top:0;width:1080px;transform-origin:50% 0}
.col{position:absolute;top:0;overflow:hidden}
.col .s{position:absolute;left:0;top:0;width:100%}
.t{position:absolute;overflow:hidden;background:var(--ink);border:3.5px solid var(--ink);box-sizing:border-box;opacity:0}
.t .c{position:absolute;left:50%;top:50%;overflow:hidden;transform:translate(-50%,-50%)}
.t img{position:absolute;left:0;top:0;width:100%;height:1000%}
</style>
</head>
<body>
<div id="stage"><div id="w"></div></div>
<script>
const dur = D.n('dur', '0.67'), t0 = D.n('t0', '0.05'), H = D.n('alt', '1000'), V = D.n('vel', '120'), G = 7;
const E1 = 0.13, E2 = 0.2; // pipoca (estalo, um a um) e depois a grade encolhe de 1,6 a 1
const Q = 'muro-quadros/s'; // 21 sprites: 10 quadros (15 qps) de Reels nossos, empilhados; troca no tempo
const W = document.getElementById('w'); W.style.height = H + 'px';
// 4 por coluna: na alt 1200 sai quadrado e 9:16 misturado, como na ref
const cols = [[262, [1, 1.7, 1, 1.2]], [296, [1.3, 1, 1.6, 1]], [244, [1, 1.6, 1.1, 1]], [257, [1.5, 1, 1.2, 1.1]]];
let x = 0, k = 0, seed = 7; const tiles = [], fitas = [], extra = [];
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function bloco(fita, cw, y, h, img) {
  const t = document.createElement('div'); t.className = 't';
  t.style.cssText = `left:0;top:${y - G / 2}px;width:${cw + G}px;height:${h + G}px`;
  const bw = cw + G - 7, bh = h + G - 7, cwid = Math.max(bw, bh * 9 / 16); // cobre o bloco com quadro 9:16
  t.innerHTML = `<div class="c" style="width:${cwid}px;height:${cwid * 16 / 9}px"><img src="${Q}${img}.jpg"></div>`;
  fita.appendChild(t); return t;
}
cols.forEach(([cw, ws], ci) => {
  const tot = ws.reduce((a, b) => a + b, 0), livre = H - G * (ws.length - 1); let y = 0;
  const col = document.createElement('div'); col.className = 'col';
  col.style.cssText = `left:${x - G / 2}px;width:${cw + G}px;height:${H}px`;
  const fita = document.createElement('div'); fita.className = 's'; col.appendChild(fita); W.appendChild(col); fitas.push(fita);
  const i0 = tiles.length;
  ws.forEach(w => {
    const h = livre * w / tot;
    tiles.push(bloco(fita, cw, y, h, (k * 5 + ci * 2) % 21)); y += h + G; k++;
  });
  // um bloco a mais em cima e embaixo: a rolagem não abre buraco (300 px > vel × dur)
  extra.push([bloco(fita, cw, -300 - G, 300, (ci * 7 + 3) % 21), i0], [bloco(fita, cw, H + G, 300, (ci * 7 + 11) % 21), tiles.length - 1]);
  x += cw + G;
});
// ordem de entrada: 60% estalam em lugares espalhados na 1a fase, o resto pelas bordas na 2a
const ordem = tiles.map((t, i) => i).sort(() => rnd() - .5);
D.monta(tl => {
  tl.set(W, {scale: 1.6}, 0);
  tl.to(W, {scale: 1, duration: E2, ease: 'power3.out'}, t0 + E1);
  const quando = [];
  ordem.forEach((i, n) => {
    const fase1 = n < ordem.length * .6, at = fase1 ? t0 + rnd() * E1 : t0 + E1 + rnd() * E2 * .8;
    tl.set(tiles[i], {opacity: 1}, at); quando[i] = at;
    const im = tiles[i].querySelector('img');
    for (let f = 0; f < 10; f++) tl.set(im, {yPercent: -f * 10}, t0 + f / 15 + (i % 3) * .02);
  });
  // o bloco a mais aparece junto com o vizinho de coluna
  extra.forEach(([t, viz], n) => {
    tl.set(t, {opacity: 1}, quando[viz]);
    const im = t.querySelector('img');
    for (let f = 0; f < 10; f++) tl.set(im, {yPercent: -f * 10}, t0 + f / 15 + (n % 3) * .02);
  });
  fitas.forEach((f, ci) => tl.fromTo(f, {y: 0}, {y: (ci % 2 ? 1 : -1) * V * (dur - t0), duration: dur - t0, ease: 'none'}, t0));
  D.cue(t0, 'swish');
  return dur;
});
</script>
</body>
</html>
