<!DOCTYPE html>
<!-- PROVA — a janela do guia no nosso visual (r_guia_papel: o r_guia é o do pacote neon), com os pedidos prontos pra copiar. 1080x1920, --alpha, tema da direção (papel, tinta, azul e amarelo).
     A mecânica do anúncio de edição do concorrente (videos/fabrica/avatar-camadas/REF.md, 32,5–36 s): a janela
     do documento sobe atrás da cabeça (quem põe atrás é o compositor, com a pessoa recortada por cima), os
     blocos de pedido acendem um por vez e o botão "Copiar" vira "Copiado ✓".
       arq   o nome na barra · h  o título do documento
       bl    "seção|pedido@t;…" os blocos (o t é quando acende) · t_copia  o clique no Copiar do último bloco
       y     o topo da janela (280) · dur · sai=0
     ?arq=GUIA-DE-PEDIDOS.md&h=Guia de pedidos&bl=Reel do celular|corta o vídeo que eu gravei no celular e põe legenda@0.6;Legenda|põe legenda com a palavra PREÇO em destaque@1.2;Ícones animados|põe um ícone animado em cada ideia do roteiro@1.8&t_copia=2.4&dur=3.2&tema=neon -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block;position:relative}
#jan{position:absolute;left:90px;width:900px;opacity:0;padding:0 0 34px;background:var(--sur);border:var(--bw) solid var(--ink);border-radius:var(--raio);box-shadow:var(--sh) var(--sh) 0 var(--ink)}
#barra{height:72px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:var(--bw) solid var(--ink);background:var(--mk);font:700 28px/1 var(--fm);color:var(--ink)}
#barra i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
#barra .arq{margin-left:14px}
.h{padding:28px 36px 4px;font:700 70px/1 var(--fd);letter-spacing:var(--ls);color:var(--ink)}
.bl{margin:16px 36px 0;opacity:.4}
.bl .s{font:700 40px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink6)}
.bl .c{position:relative;margin-top:12px;padding:20px 200px 20px 24px;border-radius:var(--raio-s);background:var(--cod);border:var(--bw) solid var(--ink);
  font:700 52px/1.2 var(--fm);color:var(--cod-tx)}
.bl .cp{position:absolute;right:14px;top:50%;margin-top:-30px;padding:16px 20px;border-radius:8px;font:700 30px/1 var(--fm);color:var(--ink);
  background:var(--mk);border:3px solid var(--ink)}
.bl .cp.ok{background:var(--ok);color:#fff}
</style>
</head>
<body>
<div id="stage"><div id="jan"><div id="barra"><i></i><i></i><i></i><span class="arq"></span></div><div class="h"></div></div></div>
<script>
const dur = D.n('dur', '3.2');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const jan = document.getElementById('jan');
jan.style.top = D.n('y', '280') + 'px';
jan.querySelector('.arq').textContent = D.q('arq', 'GUIA-DE-PEDIDOS.md');
jan.querySelector('.h').textContent = D.q('h', 'Guia de pedidos');
const bl = D.itens('bl', 'Reel do celular|corta o vídeo que eu gravei no celular e põe legenda@0.6;Legenda|põe legenda com a palavra PREÇO em destaque@1.2;Ícones animados|põe um ícone animado em cada ideia do roteiro@1.8', ['s', 'c']);
bl.forEach((b, i) => jan.insertAdjacentHTML('beforeend',
  `<div class="bl" id="bl${i}"><div class="s">${esc(b.s)}</div><div class="c">${esc(b.c)}<span class="cp">Copiar</span></div></div>`));

D.monta(tl => {
  // a janela sobe de baixo, de dentro do desfoque
  tl.fromTo(jan, {opacity: 0, y: 160, scale: .94, filter: 'blur(8px)'}, {opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: .5, ease: 'expo.out'}, 0);
  D.cue(0, 'whoosh');
  bl.forEach((b, i) => {
    const el = document.getElementById('bl' + i), c = el.querySelector('.c');
    tl.to(el, {opacity: 1, duration: .2}, D.at(b.t));
    tl.fromTo(c, {borderColor: '#0B0D12', boxShadow: '0 0 0 #0B0D12'},
      {borderColor: '#0640fb', boxShadow: '8px 8px 0 #0640fb', duration: .25, immediateRender: false}, D.at(b.t));
    if (i < bl.length - 1) tl.to(c, {borderColor: '#0B0D12', boxShadow: '0 0 0 #0B0D12', duration: .25}, D.at(bl[i + 1].t));
    D.cue(b.t, 'click');
  });
  const tc = D.n('t_copia', '2.4');
  const cp = document.querySelector('#bl' + (bl.length - 1) + ' .cp');
  tl.set(cp, {className: 'cp ok', textContent: 'Copiado ✓'}, tc);
  tl.fromTo(cp, {scale: 1.3}, {scale: 1, duration: .3, ease: 'expo.out', immediateRender: false}, tc);
  D.cue(tc, 'certo');
  if (D.q('sai', '1') !== '0') {
    tl.to(jan, {opacity: 0, y: -40, filter: 'blur(10px)', duration: .26, ease: D.P.SAI}, dur - .28);
    D.cue(dur - .28, 'whoosh-out');
  }
  return dur;
});
</script>
</body>
</html>
