<!DOCTYPE html>
<!-- GANCHO — tela final (end screen). 1920x1080, papel. Não sai: é o fim do vídeo.
     As molduras marcam onde os elementos do YouTube entram (dois vídeos e o
     círculo de inscrição). No YouTube Studio, alinhe os elementos a elas:
       vídeo 1  x 1306 · y 152 · 544×306        vídeo 2  x 1306 · y 562 · 544×306
       inscrição  círculo de 300 em x 120 · y 572
     Tudo acima da faixa do player (y 896, a barra de progresso) e dentro da área que o
     editor de tela final aceita (x 48–1878, y 140–915): a conta no LEIA-ME, "Faixa do player".
     Dura 10 s (dono, 07/10; é o padrão de ?dur): tudo pousa até ~1,6 s, então os elementos
     do Studio (últimos 10 s do vídeo) entram com as molduras já no lugar.
     ?guias=0 esconde o texto "o YouTube põe..." pro render final.
     ?logo=url põe a imagem no círculo da inscrição (o avatar do canal, o mesmo que o YouTube põe por cima).
       ?hd=Assista a <b>seguir</b>&rot1=a próxima aula&rot2=comece por aqui
        &ins=se inscreve pra não perder a próxima&t0=0.2&dur=10 -->
<html lang="pt-BR" class="h">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
.esq{position:absolute;left:120px;top:150px;width:800px}
.esq .hd{font-size:112px;margin:0}
.ins{position:absolute;left:120px;top:572px;display:flex;align-items:center;gap:34px}
.sl{position:relative;border:4px dashed var(--ink4);border-radius:10px;background:rgba(11,13,18,.05);display:flex;align-items:center;justify-content:center}
.sl span{font:600 20px/1.35 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);text-align:center;padding:0 24px}
.ins .sl{flex:none;width:300px;height:300px;border-radius:50%;opacity:0}
.ins .tx{font:700 36px/1.2 var(--fd);letter-spacing:-.02em;color:var(--ink);max-width:420px;opacity:0}
.vd{position:absolute;left:1292px;width:572px}
.vd .rt{display:inline-block;margin-bottom:8px;padding:10px 16px 8px;font:700 22px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;border-radius:var(--raio-s);opacity:0}
.vd .fr{padding:10px;opacity:0}
.vd .sl{width:544px;height:306px;box-sizing:border-box}
html.sem-guias .sl span{display:none}
.ins .sl img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);border-radius:50%;object-fit:cover}
</style>
</head>
<body>
<div id="stage">
  <div class="esq"><div class="kick" id="k"></div><div class="hd" id="hd"></div></div>
  <div class="ins"><div class="sl" id="ci"><span>inscrição</span></div><div class="tx" id="it"></div></div>
  <div class="vd" id="v1" style="top:82px"><div class="rt nb cor-mk" id="r1"></div><div class="fr nb" id="f1"><div class="sl"><span>o YouTube põe o vídeo aqui</span></div></div></div>
  <div class="vd" id="v2" style="top:492px"><div class="rt nb cor-ac" id="r2"></div><div class="fr nb" id="f2"><div class="sl"><span>o YouTube põe o vídeo aqui</span></div></div></div>
</div>
<script>
const dur = D.n('dur', '10'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
if (D.q('guias', '1') === '0') document.documentElement.classList.add('sem-guias');
$('k').textContent = D.q('kick', 'fim da aula');
$('hd').innerHTML = D.q('hd', 'Assista a <b>seguir</b>');
$('r1').textContent = D.q('rot1', 'a próxima aula');
$('r2').textContent = D.q('rot2', 'comece por aqui');
$('it').textContent = D.q('ins', 'se inscreve pra não perder a próxima');
if (D.q('logo')) $('ci').insertAdjacentHTML('beforeend', `<img src="${D.q('logo')}" alt="">`);

D.monta(tl => {
  D.carimbo('#k', t0, 0);
  D.titulo('#hd', t0 + .12, .07);
  D.pousa('#f1', t0 + .3, {dx: 90, dy: 0, som: 'pop'});
  D.pousa('#f2', t0 + .45, {dx: 90, dy: 0});
  D.carimbo('#r1', t0 + .6, 0);
  D.carimbo('#r2', t0 + .72, 0);
  tl.fromTo('#ci', {opacity: 0, scale: .5}, {opacity: 1, scale: 1, duration: .5, ease: D.P.MOLA}, D.at(t0 + .8));
  D.entra('#it', t0 + .95, 14);
  D.flutua(['#r1', '#r2'], t0 + 1.4, dur, 3);
  if (D.q('sai', '0') === '1') D.sai(['#k', '#hd', '.vd', '.ins'], dur - .45);
  return dur;
});
</script>
</body>
</html>
