<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#06090a; --verde:#8be04e; --verde-esc:#1f4d2b; --texto:#f3ede3; --cinza:#aeb7be; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; }
  body { position:relative; overflow:hidden; background:var(--bg); font-family:'Radio Canada Big', sans-serif; color:var(--texto); }
  .foto { position:absolute; left:0; top:-120px; width:1080px; height:1080px; object-fit:cover; }
  .fade { position:absolute; inset:0; background:
      linear-gradient(180deg, rgba(6,9,10,.55) 0%, rgba(6,9,10,0) 18%, rgba(6,9,10,0) 46%, rgba(6,9,10,.92) 64%, var(--bg) 72%); }
  .glow { position:absolute; left:-200px; bottom:-260px; width:900px; height:900px; border-radius:50%;
      background:radial-gradient(circle, rgba(139,224,78,.16) 0%, rgba(139,224,78,0) 65%); }
  .riscos { position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(139,224,78,.05) 0 2px, transparent 2px 38px); mask-image:linear-gradient(180deg, transparent 55%, #000 100%); -webkit-mask-image:linear-gradient(180deg, transparent 55%, #000 100%); }
  body::after { content:""; position:absolute; inset:0; filter:url(#noise); opacity:.06; pointer-events:none; }
  .barra { position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--verde); }

  .topo { position:absolute; top:56px; left:66px; right:56px; display:flex; justify-content:space-between; align-items:center; }
  .selo { background:var(--verde); color:#07130a; font-weight:700; font-size:24px; letter-spacing:5px; padding:12px 22px; text-transform:uppercase; }
  .marca { font-size:22px; letter-spacing:4px; text-transform:uppercase; color:var(--cinza); }

  .conteudo { position:absolute; left:66px; right:56px; bottom:92px; }
  h1 { font-size:92px; line-height:.98; font-weight:700; letter-spacing:-2px; text-transform:uppercase; }
  h1 em { font-style:normal; color:var(--verde); text-shadow:0 0 40px rgba(139,224,78,.35); }
  .linha { display:flex; align-items:center; gap:30px; margin-top:44px; padding-top:34px; border-top:2px solid rgba(243,237,227,.18); }
  .num { font-size:200px; line-height:.78; font-weight:700; color:var(--verde); letter-spacing:-8px; text-shadow:0 0 60px rgba(139,224,78,.3); }
  .rot { display:flex; flex-direction:column; gap:8px; }
  .rot .a { font-size:26px; letter-spacing:6px; text-transform:uppercase; color:var(--cinza); }
  .rot .b { font-size:54px; font-weight:700; line-height:1; text-transform:uppercase; }
  .rot .c { font-size:30px; color:var(--cinza); }

  .progresso { position:absolute; left:0; bottom:0; height:4px; width:calc(1080px / 10); background:var(--verde); }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter></svg>

<img class="foto" src="../imagens/duas-armaduras.jpg" alt="">
<div class="fade"></div>
<div class="glow"></div>
<div class="riscos"></div>
<div class="barra"></div>

<div class="topo">
  <span class="selo">Pedidos abertos</span>
  <span class="marca">Uniqee</span>
</div>

<div class="conteudo">
  <h1>A camisa da<br>estreia de <em>Doomsday</em></h1>
  <div class="linha">
    <div class="num">31</div>
    <div class="rot">
      <span class="a">Faltam</span>
      <span class="b">dias</span>
      <span class="c">Estreia nos cinemas em 17 de dezembro.</span>
    </div>
  </div>
</div>

<div class="progresso"></div>
</body>
</html>
